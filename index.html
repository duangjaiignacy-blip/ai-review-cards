": "根源是模型概率生成的随机性/幻觉，以及无法直接出长视频、需多段短片拼接导致片段间不一致。", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像找不同画师接力画同一个人，各画各的还得拼接，难免长得不一样 🎨"}, {"id": "kc-0622am-09", "type": "choice", "front": "笔记中数据层「正向数据循环」的经典案例是哪一对？", "options": ["即梦 × Lovart", "Cursor × Anthropic", "Elise × Soul", "Second Me × Butterflies"], "answer": 1, "explain": "Cursor 调用 Anthropic 的 Claude 满足代码生成需求，积累的用户代码数据反哺 Claude 迭代，Cursor 后续还出了自研 Composer。", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像滚雪球：用得越多攒的数据越多，数据反过来让模型更强、吸引更多人用 ❄️"}, {"id": "kc-0622am-10", "type": "choice", "front": "老师指出 Elise 启用邀请码，除饥饿营销外的「深层核心原因」是什么？", "options": ["保护用户隐私数据", "等待监管审批", "防止竞品爬取数据", "产品不赚钱，必须控制用户规模来降低算力成本"], "answer": 3, "explain": "核心是产品不赚钱，需要控制用户规模降低算力成本，由此引出 PM 必须考虑成本控制。", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像网红店不赚钱时故意限号排队，既显得抢手、又压住了成本 🎟️"}, {"id": "kc-0622am-11", "type": "choice", "front": "在「饭盒」编剧 Agent 这一未收费环节，团队在模型选择上的策略是？", "options": ["用最高阶模型保证质量", "随机选择模型", "完全不调用模型，纯规则处理", "用轻量模型控成本，进入付费环节后再调高质量模型"], "answer": 3, "explain": "编剧环节未收钱，用轻量模型控成本；进入付费节点后再调高质量模型生成，体现成本灵活。", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像草稿用铅笔(便宜)、定稿才上钢笔(贵模型)，没收钱的环节先省着 ✏️"}, {"id": "kc-0622am-12", "type": "choice", "front": "市场层做赛道与竞品份额分析时，笔记推荐的信息获取渠道是？", "options": ["竞品官网与创始人访谈", "艾瑞咨询、动见研报、月湖报告等市场研报", "用户问卷与深度访谈", "Building in Public"], "answer": 1, "explain": "市场层的宏观数据（赛道规模、竞品份额）已被艾瑞咨询、动见研报、月湖报告等机构整理好，PM 不必从零分析。", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像查行情不用自己跑市场，艾瑞这些机构早把报告整理好了，拿来用 📊"}, {"id": "kc-0622am-13", "type": "choice", "front": "测试 AIGC 产品时，笔记强调要评估的两个核心能力是？", "options": ["响应速度与并发量", "UI 美观度与文案质量", "过程能力（每步生成稳定性）与端到端输出能力（最终结果质量）", "注册转化率与付费率"], "answer": 2, "explain": "前提是先理解核心定位与场景，再评估过程能力=每步生成稳定性、端到端输出能力=最终结果质量。", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像考厨师：既看每道工序稳不稳(过程)，也看最后端上桌好不好吃(结果) 👨‍🍳"}, {"id": "kc-0622am-qa-01", "type": "qa", "front": "AI 产品深度体验汇报中，「PM 汇报四问」（面试必背）是哪四个？", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "一是产品给哪类用户解决什么问题；二是产品用什么方案解决问题；三是产品的变现模式是什么；四是产品如何控制成本（防止成本过高）。这四问是 AI 产品深度体验汇报必讲的核心，也是面试要点。", "analogy": "像介绍一家店必答四件事：卖给谁、怎么做、靠啥赚钱、怎么控成本 🏷️"}, {"id": "kc-0622am-qa-02", "type": "qa", "front": "老师给出的「拆解一个 Agent 的标准四问」是什么？", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "一问用哪个模型、为什么；二问提示词怎么处理复杂任务、任务流程是什么；三问用了哪些工具、为什么；四问怎么保证产出结果质量。这是分析任意 Agent 的标准追问框架。", "analogy": "像验车四连问：用啥发动机、怎么跑流程、带了啥配件、跑得稳不稳 🚗"}, {"id": "kc-0622am-qa-03", "type": "qa", "front": "为什么说「拆解」是 AI 产品经理最底层的能力？它适配哪两类工作场景？", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "因为市面上多数人对 AI 产品的认知只停在表层功能，而 PM 必须能讲清表层功能、背后技术点以及为什么用这些技术。它适配两类场景：0→1（无参考时看竞品怎么做，深度体验为竞品分析打地基）和 1→N（进公司先深度体验已有产品再迭代）。掌握后遇到新技术也能自主分析。", "analogy": "像厨师不仅会吃，还能尝出用了啥料、什么火候、为啥这么做 🍲"}, {"id": "kc-0622am-qa-04", "type": "qa", "front": "Elise 的「留存死亡螺旋」是怎么形成的？", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "高质量输出需要大量输入，但用户要先看到高质量输出才愿持续输入；输入不足导致分身不准、连接无效、用户流失，没有 context 回流。根源是核心价值的成熟周期长于用户耐心周期，这个时间差就是留存问题的根源。", "analogy": "像健身房：得先练出效果才有动力，可没动力就练不出效果，恶性循环退卡 🏋️"}, {"id": "kc-0622am-qa-05", "type": "qa", "front": "「饭盒」分镜师 Agent 为什么要给画面、音频、音乐都标注明确的时间分段？", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "因为当前模型输入可多模态、但输出还做不到一次性生成「视频+字幕+配音」，多模块独立生成会出现节奏对齐问题。所以靠统一一段提示词加时间分段，让画面、音频、台词对得上，例如台词在 8-9 秒才出现，8 秒前就不配台词。", "analogy": "像配音对口型：画面、台词、音乐都得卡着秒数对齐，不然牛头不对马嘴 🎬"}, {"id": "kc-0622am-qa-06", "type": "qa", "front": "商业层做拆解时，笔记给出的三个信息获取渠道分别是什么、各能挖到什么？", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "一是竞品官网，可直接查变现方式；二是创始人访谈，虽不讲细节但会不经意透露信息，足够面试或做产品借鉴；三是 Building in Public，即创始人在 X 上公开开发过程，可挖冷启动和目标用户信息。案例是 Elise 早期靠小红书营销获取种子用户。", "analogy": "像摸一家店的底：看官网价目表、听老板访谈漏的口风、追他公开的动态 🕵️"}, {"id": "kc-0622am-qa-07", "type": "qa", "front": "角色设计师 Agent 为什么要把「给用户看的角色描述」翻译成「给模型看的精细化专业提示词」？", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "因为用户看的信息和模型看的信息存在信息差，例如「背斗笠、挂玉佩」这类描述对模型来说不够细。所以要翻译成英文、极细的专业提示词，并生成角色参考图供用户提前确认、避免后续生成出错浪费钱，同时给后续模型做风格参考。", "analogy": "像跟装修师傅说「要高级感」没用，得换成「米白墙+黄铜灯」这种他能照做的话 🛋️"}, {"id": "kc-0622am-rc-01", "type": "recall", "front": "复述：AI 产品拆解六层框架的六个层级、归属及各自核心问题。", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "产品之外：①市场层——赛道能不能进入、核心竞品是谁占多大份额，决定要不要立项；②商业层——怎么赚钱不亏本、定位与差异化、种子用户从哪来。产品之内：③用户层——目标用户/核心场景/痛点，反推核心功能；④技术层——用什么 AI 技术（PE/Agent/RAG）实现，梳理技术流程；⑤模型层——模型选型+评测+成本核算；⑥数据层（基础层）——依赖哪些数据、使用产生哪些数据、能否形成数据正向循环。", "analogy": "像剥洋葱：从外层的市场、商业，一层层剥到核心的数据 🧅"}, {"id": "kc-0622am-rc-02", "type": "recall", "front": "复述：「饭盒」漫剧多 Agent 流水线的主要阶段与各自职责。", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "共标注 7 个 Agent，默认流水线协作、可回退、每步可确认。①艺术总监·需求承接——抽象角色信息、初始化故事；②艺术总监·需求澄清——确认影片长度/画面比例/对白语言；③艺术总监·风格匹配——用 RAG 匹配漫剧风格、生成 5 个情绪关键词；④编剧 Agent——提炼角色数量/分镜、对应付费规则，付费前用轻量模型；⑤付费节点——按角色计积分，之后调高质量模型；⑥角色设计师——翻译成模型提示词、生成参考图与三视图；⑦分镜师——转场景/音乐提示词、标时间分段、生成并拼接成完整漫剧。", "analogy": "像影视剧组：导演、编剧、美术、分镜各司其职，流水线接力出片 🎞️"}, {"id": "kc-0622am-rc-03", "type": "recall", "front": "复述：风格一致性难题的三大核心解法。", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "①统一情绪关键词——流程开始前提取统一核心情绪词（如悬疑剧用「悬念」），同步用于场景生成、音乐生成等全流程，从源头统一约束；②角色参考图+三视图——给后续生成模型提供风格与多角度参考，解决角色崩坏；③时间分段对齐——给画面/音频/音乐标时间段，解决多模块拼接的节奏对齐。", "analogy": "像拍剧统一定调：定个主情绪、备好角色定妆照、给画师统一画风模板 🎨"}, {"id": "kc-0622am-rc-04", "type": "recall", "front": "复述：老师定性 Elise 遇冷的主要原因。", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "①预社交场景痛点不刚——AI 替代掉了用户最需要、最能获得愉悦感的破冰环节，反而降低真实社交意愿；②信任与数据拿不到——注册强制收集信息但不核心，真正核心的信息用户不愿给、第三方平台也不会开放敏感社交数据，冷启动信任难题基本无解；③AI 能力不足——记忆不串联、语音识别抗干扰差、拟人化低，达不到「复刻第二个自己」；④变现靠融资、用户不付费，叠加留存死亡螺旋。", "analogy": "像替你把约会最甜的部分代办了、还要你先交个人隐私，自然没人买账 💔"}, {"id": "kc-0622am-rc-05", "type": "recall", "front": "复述：本周课程核心目标与要产出的全套项目文档。", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "本周核心目标是带各小组完成小组项目立项、产出全套项目文档。文档顺序为：立项报告→竞品分析→评测文档→模型选型文档→PRD。技术进阶规划本周讲 RAG（约 2-3 天）、Agent 再进阶一次、模型评测；下周由「国国哥」带 web coding 把项目落地；个人项目硬要求是必须做成上线的产品。"}, {"id": "kc-0622am-rc-06", "type": "recall", "front": "复述：模型层在模型选型上的要点与笔记给的两个模型适用举例。", "cat": "课程", "source": "6-22上午 AI产品深度体验与架构拆解", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "模型层核心是模型选型+模型评测+成本核算：结合场景选适配模型，算清成本（输入、输出、缓存输出定价各不相同），不同模型适用不同场景，后续会带做深度模型评测来为自己产品选合适模型。举例：Sora 2 适合电影级质感视频（报价通常很贵）；GPT Image 适合带思维导图、小插画的图，生成效果好。", "analogy": "像配电脑按用途选配件、算好预算，打游戏和剪视频配的不一样 🖥️"}, {"id": "kc-0622pm-01", "type": "choice", "front": "OYO 这款 AIGC 动画产品自上而下分为四层架构，其中「角色库、我的项目、项目协作」属于哪一层？", "options": ["用户层", "应用层", "模型层", "基础层"], "answer": 0, "explain": "角色库/我的项目体现项目管理思维，贴合专业动画从业者的工作场景，属于用户层。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像给设计师配的「我的项目+素材库」，贴着他平时干活的习惯来设计 🗂️"}, {"id": "kc-0622pm-02", "type": "choice", "front": "老师强调 OYO 产品设计自始至终要平衡的两个核心目标是什么？", "options": ["成本低 + 效果好", "速度快 + 功能多", "界面美 + 操作简", "用户多 + 留存高"], "answer": 0, "explain": "贯穿四层架构的核心设计目标始终是「成本低 + 效果好」，这是产品经理必须平衡的两点。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像又要马儿跑、又要马儿少吃草，产品经理天天在这俩之间走钢丝 🐎"}, {"id": "kc-0622pm-03", "type": "choice", "front": "关于 OYO 基础层里的「点赞点踩数据」，下列说法最准确的是？", "options": ["只用于展示给其他用户参考", "主要用于计算用户的付费额度", "是产品自我迭代的燃料，用来判断哪些效果保留、哪些改掉", "是用来给创作者分成的依据"], "answer": 2, "explain": "老师点明点赞点踩数据 = 产品自我迭代的燃料，回流后持续迭代模型与内容。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像饭馆的顾客评价：好评差评都是改进菜单的燃料 👍"}, {"id": "kc-0622pm-04", "type": "choice", "front": "老师反复强调，当前 AIGC 创业更适合走哪条路线？", "options": ["通用大而全方向", "只做海外市场", "纯免费抢市场", "细分定位路线"], "answer": 3, "explain": "老师结论是当前 AIGC 创业更适合细分定位，通用方向很难建立足够厚的产品壁垒。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像小馆子专做一道地方菜反而火，什么都做的大食堂没特色 🍛"}, {"id": "kc-0622pm-05", "type": "choice", "front": "OYO 的护城河 / 产品壁垒主要在哪里？", "options": ["工程实现与模型路由", "表层功能设计与界面交互", "巨额广告投放", "创始人个人 IP"], "answer": 0, "explain": "OYO 的壁垒基本全部在工程实现与模型路由上，而非表层功能设计。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像奶茶店真正难抄的是供应链和配方，不是菜单长啥样 🧋"}, {"id": "kc-0622pm-06", "type": "choice", "front": "多 Agent 协作中，把无前后依赖的任务拆给多个 Agent 同时执行、全部完成后统一汇总，属于哪种协作类型？", "options": ["串联型", "对抗型", "并联型", "嵌套型"], "answer": 2, "explain": "并联型 = 提前拆 to-do list、无依赖任务并行执行后汇总，典型如 Claude 的多 Agent 调研。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像大扫除分头同时干，各扫各的房间，扫完再汇总 🧹"}, {"id": "kc-0622pm-07", "type": "choice", "front": "本次拆解的 OYO 视频生成产品属于哪一种多 Agent 协作类型？", "options": ["并联型", "串联型", "对抗型", "混合型"], "answer": 1, "explain": "OYO 视频生成是典型串联：任务按固定流程顺序执行，前一个完成才进入下一个，流程不可跳跃。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像接力赛：上一棒跑到才能交棒，顺序不能乱 🏃"}, {"id": "kc-0622pm-08", "type": "choice", "front": "OYO 上模型名只写到「Sora 2」这种层级、不明说底层用什么模型，下列哪一项不是老师给出的原因？", "options": ["防止用户绕过产品直接去调那个模型", "对小白屏蔽复杂度", "便于用户对比各模型价格自行选择", "规避风险（你知我知但不承认用了什么模型）"], "answer": 2, "explain": "老师给的三个原因是防绕过、屏蔽复杂度、规避风险；让用户自行对比价格并非目的。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像菜单只写「招牌牛肉」，不告诉你供货商是谁——防同行抄、也省得你纠结 🥩"}, {"id": "kc-0622pm-09", "type": "choice", "front": "Agent 五大核心组件中，「规定大模型如何规划一个任务」的是哪一个组件？", "options": ["记忆", "提示词（System Prompt）", "工具", "执行"], "answer": 1, "explain": "提示词（System Prompt）规定大模型如何规划任务，可理解为「如何规划任务」的规则。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像系统提示词是员工的「工作 SOP 手册」，规定他怎么安排活 📋"}, {"id": "kc-0622pm-10", "type": "choice", "front": "在「表单交互工具 vs 生成式 UI」的对比中，关于开发成本下列哪项符合笔记？", "options": ["两者开发周期相当", "生成式 UI 比表单更省事", "表单工具至少要 1 个月", "表单工具开发周期通常 ≤1 周，生成式 UI 至少 1 个月"], "answer": 3, "explain": "表单交互工具开发周期通常 ≤1 周，生成式 UI 是前沿技术、开发成本高、至少 1 个月。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像填固定表格(几天就能搭) 对比 现场给你量身定制装修(起码一个月) 🏗️"}, {"id": "kc-0622pm-11", "type": "choice", "front": "提示词从 1.0 版到可用的迭代套路，老师强调的正确节奏是？", "options": ["先精简字数再加规则", "先加规则/限制/事例直到稳定，再精简字数，循环迭代", "一次写到最完美不再改", "字数越少越好，能删就删"], "answer": 1, "explain": "迭代节奏 = 写第一版→评测→效果不好就慢慢加规则/限制/事例→稳定后再减字数→持续循环。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像炖汤先多放调料试味，对了再慢慢减，反复调到刚好 🍲"}, {"id": "kc-0622pm-12", "type": "choice", "front": "立项的本质，按课件定义是什么？", "options": ["一份漂亮的 PPT", "一张完整的产品流程图", "一份技术架构设计文档", "一份「为什么该做」的证据清单"], "answer": 3, "explain": "立项 = 一份「为什么该做」的证据清单，给四个问题写答案，不是 PPT 也不是流程图。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像向银行贷款：得拿一摞「为什么靠谱」的证据，不是做几页漂亮 PPT 🏦"}, {"id": "kc-0622pm-13", "type": "choice", "front": "市场规模的 TAM / SAM / SOM 三个圈中，「该跟老板或投资人说的数字」对应哪一个？", "options": ["TAM 最外圈", "SAM 中间圈", "SOM 最里圈", "三个都一样"], "answer": 2, "explain": "SOM（实际能获取）才是该跟老板/投资人说的数字；TAM 讲故事用、SAM 是真正战场。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像卖伞：全城人是 TAM，会下雨买伞的是 SAM，真进你店买的是 SOM(才是跟老板报的数) ☂️"}, {"id": "kc-0622pm-14", "type": "choice", "front": "判断市场增长的「4 个不会骗人的指标」不包括下列哪一项？", "options": ["融资新闻密度", "产品的 UI 美观度", "大公司有没有动作", "招聘岗位数量"], "answer": 1, "explain": "四个增长指标是融资密度、大厂动作、用户讨论、招聘岗位；UI 美观度不在其列。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像看一个行业火不火：有没有人砸钱、大厂动没动、网上聊得多不多、招不招人 🔥"}, {"id": "kc-0622pm-15", "type": "choice", "front": "竞品分析四象限中，与抖音「业务相同、用户相同、抢同样的人」的是哪一类，课件举的例子是？", "options": ["间接竞品 · 视频号", "潜在竞品 · 小红书", "直接竞品 · 快手", "替代品 · B 站"], "answer": 2, "explain": "直接竞品 = 业务相同+用户相同，课件以抖音视角举例为快手（同样的事抢同样的人）。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像你家楼下早餐店：卖一样的东西、抢一样的客人，就是直接对手 🍳"}, {"id": "kc-0622pm-16", "type": "choice", "front": "按「频率 × 痛感」的痛点优先级矩阵，已核实的正确结论是？", "options": ["高频 + 痛感弱 = 必须解决", "高频 + 痛感强 = 必须解决（最高优先级）", "低频 + 痛感强 = 必须解决", "低频 + 痛感弱 = 必须解决"], "answer": 1, "explain": "频率越高 × 痛感越强 = 必须解决；注意官方课件 SLIDE 23 顶行标签写反了，面试一律答高频高痛=必须解决。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "analogy": "像挑毛病先修又常犯又难受的：高频高痛的，必须先解决 🎯"}, {"id": "kc-0622pm-qa-01", "type": "qa", "front": "OYO 模型层为什么要同时用文本、图片、音频、视频四类模型？", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "因为一个模型搞不定 AIGC 动画的全流程。文本模型负责理解需求/生成台词，图片模型生成角色，再到音频和视频生成，需要多模型配合。目标是在视频效果好的同时把成本压低。", "analogy": "像拍动画要编剧、画师、配音、剪辑各路人马，一个人干不完全套 🎬"}, {"id": "kc-0622pm-qa-02", "type": "qa", "front": "OYO 的「托管模式」和「对话模式」分别面向什么用户、有何特点？", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "托管模式面向偏小白用户（没有把控能力、只关心最终效果），特点是一句话直接生成最终结果、不需要过程干预。对话模式面向有定制需求的用户，特点是生成过程中可随时通过对话调整内容方向。这两种模式正对应两类目标用户。", "analogy": "像理发：托管模式是「你看着办」(小白)，对话模式是边剪边商量(有要求的人) 💈"}, {"id": "kc-0622pm-qa-03", "type": "qa", "front": "Agent 提示词反推法的核心逻辑基础和反推步骤是什么？", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "核心逻辑是大模型/Agent 遵循「输入→处理→输出」三段结构，已知输入和输出就能反推中间的处理逻辑与核心提示词。步骤：①选一个已能运行的目标 Agent；②在不同输入场景下逐步走完并完整记录处理步骤（必须自己人工体验）；③把所有场景逻辑汇总整合；④把目的+处理+输入输出一起发给 AI，让 AI 推导出完整提示词（1.0 版，大概率不能直接用）。", "analogy": "像看到一道菜的食材和成品，反推中间是怎么炒出来的 🍳"}, {"id": "kc-0622pm-qa-04", "type": "qa", "front": "在 AI 产品立项中，「AI 负责搜、你负责判断」的分工边界是怎样的？", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "决策绝不能交给 AI，必须小组讨论通过，包括要不要做、选哪些竞品、指定数据源、判断数据可不可信、判断能不能赚钱、痛点真不真、最终拍板并担责。执行可以交给 AI，如让 AI 列竞品候选清单、用你给的报告做分析、去小红书/X 搜定价和用户反馈。此外指定数据源很重要，用户研究和深度竞品体验是 AI 替代不了的。", "analogy": "像用搜索引擎查资料可以，但买不买、信不信，得你自己拿主意、自己担责 🔎"}, {"id": "kc-0622pm-qa-05", "type": "qa", "front": "AI 命理产品案例说明了 AI 产品的什么风险？现金流风险的根因是什么？", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "它说明 AI 产品的现金流风险尤其致命：往期学姐用 Claude 一个月开发的 AI 命理产品半个月破 1000 用户、曾有投资人出价约 300 万收购，但最终现金流跑不通而停运。根因是通常给新用户免费体验额度、大部分人体验完不付费，而付费收入要覆盖模型调用成本 + 获客成本，当前小红书获客单用户成本约 2-3 元，转化不足就极易现金流断裂。", "analogy": "像网红店爆火却月月亏钱：人气再高，账上没钱照样关门 💸"}, {"id": "kc-0622pm-qa-06", "type": "qa", "front": "benchmark 的定义是什么？为什么说 benchmark 是产品的生命线？", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "benchmark 是一套评估模型/Agent 好坏的标准体系，由评估维度（测什么/评测集）+ 打分规则 + 测试数据集构成，类比高考的考卷加评分体系。它被称为产品生命线，是因为产品核心壁垒来自产品经理的品味（taste），而独特的评估标准本身就是难以复制的核心壁垒，不同 PM 推出的模型适用场景必然不同，最终产品差距还是看品味（但要靠科学评测和迭代来支撑）。", "analogy": "像高考的考卷+评分标准，没有它就没法判断模型考得好不好 📝"}, {"id": "kc-0622pm-qa-07", "type": "qa", "front": "竞品分析「选几个竞品」的三档尺度分别对应什么场景？", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "高深度选 1 个，适用单点功能对标、应对突发竞争、资源极度有限（1 人 1 天）。中深度（推荐）选 2-4 个，适用常规产品迭代、商业策略制定、中期战略规划（3 个月）。低深度选 5 个以上，适用行业全景调研、长期战略预判（1 年以上）、大型企业战略扫盘。", "analogy": "像研究对手：时间紧只盯 1 个、常规盯 2-4 个、有空摸一整片 🔭"}, {"id": "kc-0622pm-qa-08", "type": "qa", "front": "竞品分析步骤 04「决策判断」的两步动作是什么？", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "第一步列对比表：按 L1 市场/L2 商业/L3 用户三行、按「你我他」（自己与各竞品）三列做对比。第二步写一句话总结，套模板「竞品 X 强在 ___、弱在 ___ → 我们卡 ___ 的差异化锚点」。课件例如：竞品 Perplexity 强在引用透明+实时性、弱在长任务多轮深度，我们卡 Agent 化长任务调研的差异化锚点。", "analogy": "像货比三家先列对比表，再用一句话总结「它强在 X、弱在 Y，我打 Z」 📑"}, {"id": "kc-0622pm-qa-09", "type": "qa", "front": "本周作业对用户调研有哪三条硬性要求？", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "①至少 10 个真实用户（班里、朋友都行，但必须真实）；②至少 30 份真实问卷并完成数据分析；③基于问卷结果找 1-2 个目标用户做深度访谈。此外所有用到的数据都必须有明确依据，禁止臆造无来源数据。"}, {"id": "kc-0622pm-rc-01", "type": "recall", "front": "复述：OYO 的四层架构及各层核心构成与作用。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "自上而下四层：①用户层=项目协作/我的项目/角色库，体现项目管理思维、贴合专业动画从业者；②应用层=7 个核心 Agent + 配套工具，支撑视频生成全流程；③模型层=文本/图片/音频/视频四类模型配合，因一个模型搞不定 AIGC 动画；④基础层=风格库/视频知识库/内置影视专业知识 + 用户点赞点踩反馈迭代机制。贯穿目标始终是「成本低 + 效果好」。", "analogy": "像一栋楼分四层：门面接客(用户)、车间干活(应用)、发动机(模型)、油库(数据) 🏬"}, {"id": "kc-0622pm-rc-02", "type": "recall", "front": "复述：AI 产品六种主流变现模式（录音版）。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "①订阅制（月/年订阅，OYO 用阶梯式月度订阅）；②按量/按次计费（代表是 API token 按量计费，也可按积分/按次）；③项目制交付（以项目制卖给客户、后续不再额外收费）；④企业 1V1 定制（专给某企业定制、不卖给别人）；⑤效果抽成（按用户降本增效收益抽成）；⑥融资变现（产品全免费、靠投资融资赚钱）。课件 L2 只聚焦其中 4 类：免费增值/订阅/按量/买断。", "analogy": "像店铺赚钱的几种姿势：办会员、按次卖、接项目单、卖广告… 💰"}, {"id": "kc-0622pm-rc-03", "type": "recall", "front": "复述：多 Agent 全局共享上下文的两个核心构成与机制本质。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "两个构成：①项目元数据——记录这是个什么项目、版本号、谁更新过什么内容/修改历史，解决多人改文档却不知道改了什么，做统一版本管理；②核心剧本字段——前置 Agent（如编剧）一边推导一边收集的剧本类型/基本信息/风格/角色/分镜等，供后续 Agent 调用以保证角色和场景一致性。机制本质是把共享信息统一维护在一个独立位置，各 Agent 需要时调用工具去查/更新，无需在自己提示词里维护全部信息。", "analogy": "像剧组共用一个「项目群+剧本文档」，谁改了啥大家都看得到 📂"}, {"id": "kc-0622pm-rc-04", "type": "recall", "front": "复述：立项书的 6 个上游模块 + 综合环节。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "6 个上游模块：①选题与初筛（候选清单/团队投票/找老师汇报）②用户研究（访谈/Persona/JTBD/痛点矩阵，已学）③市场研究（TAM/SAM/SOM/增长/玩家，今天 CH02）④竞品分析（四象限/六层拆解/痛点四象限/决策，今天 CH03）⑤方案设计（用户旅程图/价值主张/方案草案）⑥可行性评估（技术调研/风险登记册/MVP 范围/资源清单）。第⑦综合环节=立项书本体=北极星指标+里程碑+红线（启动/暂停/终止）。立项书是攒出来的，前 6 模块都是为它服务的证据。", "analogy": "像写创业计划书的固定章节：选题、用户、市场、竞品…一节节填 📘"}, {"id": "kc-0622pm-rc-05", "type": "recall", "front": "复述：竞品分析四象限分类（两轴及四类的关系，课件抖音视角例子）。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "两轴=业务（相同/不同）× 用户（相同/不同）。①直接竞品=业务相同+用户相同（同样的事抢同样的人），例快手；②间接竞品=业务相同+用户不同（同样需求不同方案），例视频号；③潜在竞品=业务不同+用户不同（还没全力打但有能力切入），例小红书；④替代品=业务不同+用户相同（不同方式抢同一份时间），例 B 站。0→1 立项时核心分析直接竞品，其他三类也大概率要看一看。", "analogy": "像按「做不做同样的事 × 抢不抢同样的人」把对手分成四类 🧭"}, {"id": "kc-0622pm-rc-06", "type": "recall", "front": "复述：今晚作业那个跑 VC IC 级立项报告的 prompt 的铁律。", "cat": "课程", "source": "6-22下午 OYO拆解与项目立项", "srs": {"ease": 2.5, "interval": 0, "reps": 0, "lapses": 0, "due": null, "last": null}, "back": "全程必须用联网搜索 Agent、严禁纯模型记忆作答或编造数字；每个数据后必须附完整链接来源、查不到就写「查不到」不准估算；每个判断后必须跟「依据:」一行；能列表格就列表格不写段落；总字数≥3000；输出后单独跑一遍自检清单（每个数字有来源、竞品表≥5 行、用户≥3 子群、痛点≥3 类各带原话、引用清单可点击、字数达标），任何一项 No 就自动补做、不交半成品。3 步用法：每人跑 1-2 方向→组内按⭐排序选最高→把红灯+下一步验证抄进飞书=立项初版明早交。", "analogy": "像写论文必须引用真实出处：不准凭记忆瞎编，每个数字都要附链接 🔗"}];
const STANDALONE=true;
const FAST_MS=6000, LS_KEY='kun_review_v3';
/* 全网排行榜后端（Supabase）：填了就走全网榜，留空则本地榜兜底 */
const SB_URL='', SB_KEY='';
/* 多难度套卷 */
const EXAMSETS=[
  {id:'basic',     name:'基础卷',     emoji:'📘', n:15, pass:80, cat:'all',       desc:'15 题 · 跨主题 · 合格线 80'},
  {id:'interview', name:'面试冲刺卷', emoji:'🎯', n:20, pass:80, cat:'interview', desc:'20 题 · 全面试题库 · 合格线 80'},
  {id:'challenge', name:'全能挑战卷', emoji:'🔥', n:30, pass:90, cat:'all',       desc:'30 题 · 最高难度 · 合格线 90'},
  {id:'timed',     name:'限时挑战卷', emoji:'⚡', n:20, pass:80, cat:'all', timed:true, perSec:15, desc:'20 题 · 每题 15 秒 · 准确率×速度计分'},
];
let pool=[], i=0, busy=false, mode='review', cardShownAt=0, examTimer=null, qDeadline=0; const grades={};
let fCat='all', fType='all', fTopic=null, limitN=20, includeMastered=false;
let sess={answered:0,correct:0}, examLog=[], curSet=null, lastExam=null;
let store=loadStore();
const stage=document.getElementById('stage'), prog=document.getElementById('prog'),
      nav=document.getElementById('nav'), hm=document.getElementById('hm');
const TYPE={qa:'翻卡自测',choice:'选择题',recall:'必背填空'};
const TLABEL={all:'全部题型',flip:'翻卡自测',choice:'选择题'};
const CATLABEL={all:'全部',course:'日常知识',interview:'面试题库'};
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function shuffle(a){for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]];}return a;}
function isFlip(c){return c.type!=='choice';}
function lvl(c){return store.mastery[c.id]||0;}

/* ---------- 本地存储：熟练度 + 累计统计 ---------- */
function freshStore(){return {mastery:{},stats:{answered:0,correct:0},exam:{bestBySet:{}},name:'',lb:{}};}
function loadStore(){try{const j=JSON.parse(localStorage.getItem(LS_KEY));if(j&&j.mastery&&j.stats){j.exam=j.exam||{bestBySet:{}};j.exam.bestBySet=j.exam.bestBySet||{};j.lb=j.lb||{};if(typeof j.name!=='string')j.name='';return j;}}catch(e){}return freshStore();}
function saveStore(){try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){}}
function resetStore(){if(!confirm('清空所有学习记录（正确率 / 已通关 / 最佳成绩 / 本地榜）？此操作不可撤销。'))return;store=freshStore();saveStore();document.getElementById('setup').innerHTML=setupHtml();}
function bestScore(){const v=Object.values(store.exam.bestBySet||{});return v.length?Math.max.apply(null,v):0;}
function bumpStats(ok){store.stats.answered++;if(ok)store.stats.correct++;sess.answered++;if(ok)sess.correct++;saveStore();}
function setMastery(c,ok,fast,strong){
  let v=lvl(c);
  if(!ok)v=0; else v=Math.min(5, v + (strong?3:(fast?2:1)));
  store.mastery[c.id]=v; saveStore();
}

/* ---------- 过滤：类别 / 题型 / 已掌握 ---------- */
function catMatch(c,k){k=k||fCat;return k==='all'||(k==='interview'&&c.cat==='面试')||(k==='course'&&c.cat!=='面试');}
function typeMatch(c,t){t=t||fType;return t==='all'||(t==='flip'&&isFlip(c))||(t==='choice'&&c.type==='choice');}
function notMastered(c){return includeMastered||lvl(c)<5;}
function match(c){return catMatch(c)&&typeMatch(c)&&notMastered(c);}

/* ---------- 控制台 / 目录 ---------- */
function topicCounts(){const m={};CARDS.forEach(c=>{if(!match(c))return;const t=c.topic||'其他';m[t]=(m[t]||0)+1;});return m;}
function availCount(){return CARDS.filter(match).length;}
function masteredCount(){return Object.values(store.mastery).filter(v=>v>=5).length;}
function statbarHtml(){
  const s=store.stats, acc=s.answered?Math.round(s.correct/s.answered*100):0;
  return `<div class="statbar"><span>累计 <b>${s.answered}</b> 题</span><span>正确率 <b>${acc}%</b></span><span>已通关 <b>${masteredCount()}</b> 张</span><span>最佳模拟考 <b>${bestScore()}</b> 分</span><button class="reset" onclick="resetStore()">清空记录</button></div>`;
}
function setupHtml(){
  const tc=topicCounts();
  const topics=Object.keys(tc).sort((a,b)=>tc[b]-tc[a]||a.localeCompare(b,'zh'));
  const seg=Object.keys(TLABEL).map(t=>`<button class="${fType===t?'on':''}" onclick="setType('${t}')">${TLABEL[t]}</button>`).join('');
  const ns=[[10,'10 题'],[20,'20 题'],[50,'50 题'],[0,'全部']].map(([n,l])=>`<button class="${limitN===n?'on':''}" onclick="setN(${n})">${l}</button>`).join('');
  const toc=topics.map(t=>`<button class="toc-item" onclick="startTopic('${encodeURIComponent(t)}')"><span>${esc(t)}</span><em>${tc[t]}</em></button>`).join('');
  const catN={all:CARDS.filter(c=>notMastered(c)).length,course:CARDS.filter(c=>c.cat!=='面试'&&notMastered(c)).length,interview:CARDS.filter(c=>c.cat==='面试'&&notMastered(c)).length};

function startAll(){start(fType,null,limitN);}
function startTopic(enc){start(fType,decodeURIComponent(enc),0);}
function weightedPick(cands,n){
  const arr=cands.slice(), out=[]; n=Math.min(n,arr.length);
  while(out.length<n&&arr.length){
    let tot=0; const ws=arr.map(c=>{const w=6-lvl(c);tot+=w;return w;});
    let r=Math.random()*tot,k=0; while(k<arr.length&&(r-=ws[k])>0)k++; if(k>=arr.length)k=arr.length-1;
    out.push(arr.splice(k,1)[0]);
  }
  return out;
}
function start(type,topic,n){
  mode='review';fType=type;fTopic=topic;
  const cand=CARDS.filter(c=>catMatch(c,fCat)&&typeMatch(c,type)&&notMastered(c)&&(!topic||((c.topic||'其他')===topic)));
  if(!cand.length){alert('该筛选下暂时没有卡片（可能都已掌握）。换个题型/类别，或在首页点「找回已掌握卡」。');return;}
  if(n&&n>0)pool=weightedPick(cand,n);
  else{pool=cand.slice();pool.sort((a,b)=>(lvl(a)-lvl(b))||(Math.random()-0.5));}
  beginRun();
  document.getElementById('segBar').innerHTML=Object.keys(TLABEL).map(t=>`<button class="${fType===t&&!fTopic?'on':''}" onclick="start('${t}',null,limitN)">${TLABEL[t]}</button>`).join('');
}
function stratExam(ch,n){
  const byT={};ch.forEach(c=>{(byT[c.topic||'其他']=byT[c.topic||'其他']||[]).push(c);});
  Object.values(byT).forEach(shuffle);
  const order=shuffle(Object.keys(byT)); const out=[]; let added=true;
  while(out.length<n&&added){added=false;for(const t of order){if(out.length>=n)break;if(byT[t].length){out.push(byT[t].pop());added=true;}}}
  return shuffle(out);
}
function clearQTimer(){if(examTimer){clearInterval(examTimer);examTimer=null;}}
function startQTimer(){
  clearQTimer();
  const limit=curSet.perSec*1000; qDeadline=Date.now()+limit;
  const bar=document.getElementById('qbar'), sec=document.getElementById('qsec');
  examTimer=setInterval(()=>{
    const rem=qDeadline-Date.now(), f=Math.max(0,rem/limit);
    if(bar){bar.style.width=(f*100)+'%';bar.style.background=f<0.3?'var(--warn)':'var(--accent)';}
    if(sec)sec.textContent=Math.max(0,Math.ceil(rem/1000))+'s';
    if(rem<=0){clearQTimer();onTimeout();}
  },80);
}
function onTimeout(){
  if(busy)return;busy=true;

  opts.forEach((o,k)=>{o.onclick=null;o.setAttribute('disabled','');o.classList.add('dim');if(k===c.answer){o.classList.add('correct');o.classList.remove('dim');}});
  const ans=document.getElementById('ans');if(ans)ans.classList.add('show');
  setMastery(c,false,false,false);bumpStats(false);
  examLog.push({front:c.front,correct:false,picked:-1,answer:c.answer,options:c.options,points:0});
  setTimeout(()=>{i++;render();},1100);
}
function startExam(setId){

  const ch=CARDS.filter(c=>c.type==='choice'&&(set.cat==='all'||catMatch(c,set.cat)));
  if(ch.length<3){alert('该套卷选择题数量不足，无法组卷。');return;}
  pool=stratExam(ch, Math.min(set.n,ch.length)); mode='exam'; fTopic=null;

}
function beginRun(){

function topHtml(c){return `<div class="card-top"><span class="idx">CARD <em>${pad(i+1)}</em> / ${pad(pool.length)}</span><span class="ctype">${TYPE[c.type]||c.type}</span></div>`+

function knownBtn(){return mode==='exam'?'':`<button class="known-btn" onclick="master()">✓ 这题我熟了，以后少出现</button>`;}
function render(){
  if(i>=pool.length){return mode==='exam'?examFinish():finish();}

  prog.style.width=(i/pool.length*100)+'%';

      `<div class="hint">先在心里默答，再按 SPACE 翻卡，按真实掌握度评级（1–4）</div>${knownBtn()}</article>`;
    const back=`<article class="card">${topHtml(c)}<div class="q qb">${esc(c.front)}</div>`+
      `<div class="answer show"><span class="alabel">答案</span>${esc(c.back)}${c.analogy?'<div class="analogy"><span class="albl">🌰 生活类比</span>'+esc(c.analogy)+'</div>':''}</div>`+

    h=`<div class="flip anim" id="flip"><div class="flip-inner" id="flipInner"><div class="face">${front}</div><div class="face back">${back}</div></div></div>`;
  }

function syncFlip(){
  const fi=document.getElementById('flipInner');if(!fi)return;

}

function choose(idx){
  const c=pool[i], dt=Date.now()-cardShownAt, correct=idx===c.answer;
  const opts=document.querySelectorAll('.opt');
  opts.forEach((o,k)=>{o.onclick=null;o.setAttribute('disabled','');o.classList.add('dim');if(k===c.answer){o.classList.add('correct');o.classList.remove('dim');}});
  if(!correct){opts[idx].classList.add('wrong');opts[idx].classList.remove('dim');}
  document.getElementById('ans').classList.add('show');

    let points;

      clearQTimer();
      const limit=curSet.perSec*1000, rem=Math.max(0,qDeadline-Date.now());
      points = correct ? (100/pool.length)*(0.5+0.5*rem/limit) : 0;
    }
    examLog.push({front:c.front,correct,picked:idx,answer:c.answer,options:c.options,points:points||0});
    busy=true;setTimeout(()=>{i++;render();},(curSet&&curSet.timed)?650:950);return;
  }
  const rate=document.getElementById('rate');rate.classList.add('show');
  if(correct){rate.innerHTML='<button class="rb r2" onclick="next()">答对·会<span class="kc">3</span></button><button class="rb r3" onclick="master()">太简单·别再考<span class="kc">4</span></button>';}
  else{rate.innerHTML='<button class="rb r0" onclick="next()">答错·忘了<span class="kc">1</span></button><button class="rb r1" onclick="next()">答错·有印象<span class="kc">2</span></button>';}

function grade(g){

function examFinish(){
  clearQTimer();
  const set=curSet||EXAMSETS[0];

  const score=set.timed?Math.round(examLog.reduce((s,e)=>s+(e.points||0),0)):(total?Math.round(correct/total*100):0);

  store.exam.bestBySet=store.exam.bestBySet||{};
  if(score>(store.exam.bestBySet[set.id]||0)){store.exam.bestBySet[set.id]=score;saveStore();}
  lastExam={setId:set.id,setName:set.name,score,correct,total};

    `<div class="stats"><div class="stat"><b>${pad(total)}</b><span>总题数</span></div><div class="stat ok"><b>${pad(correct)}</b><span>答对</span></div><div class="stat again"><b>${pad(total-correct)}</b><span>答错</span></div></div>`+

function sbH(extra){return Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},extra||{});}
function lbLocal(e){const k=e.set_id;store.lb[k]=store.lb[k]||[];store.lb[k].push({name:e.name,score:e.score,correct:e.correct,total:e.total,created_at:new Date().toISOString()});store.lb[k].sort((a,b)=>b.score-a.score||(new Date(a.created_at)-new Date(b.created_at)));store.lb[k]=store.lb[k].slice(0,100);saveStore();}
async function lbSubmit(e){
  if(SB_URL){try{await fetch(SB_URL+'/rest/v1/leaderboard',{method:'POST',headers:sbH({'Prefer':'return=minimal'}),body:JSON.stringify({name:e.name,set_id:e.set_id,score:e.score,correct:e.correct,total:e.total})});return;}catch(err){}}
  lbLocal(e);
}
async function lbFetch(setId){
  if(SB_URL){try{const r=await fetch(SB_URL+'/rest/v1/leaderboard?set_id=eq.'+encodeURIComponent(setId)+'&order=score.desc,created_at.asc&limit=50',{headers:sbH()});if(r.ok)return await r.json();}catch(err){}}

}
function lbListHtml(list,meScore){
  if(!list||!list.length)return '<div class="lb-empty">还没有成绩，快来抢占第一名 🥇</div>';

    const isMe=!meDone&&e.name===store.name&&(meScore==null||e.score===meScore);if(isMe)meDone=true;
    const medal=['🥇','🥈','🥉'][idx]||('#'+(idx+1));
    return `<div class="lb-row${idx<3?' top':''}${isMe?' me':''}"><span class="lb-rank">${medal}</span><span class="lb-name">${esc(e.name||'匿名')}</span><span class="lb-meta">${e.correct}/${e.total}</span><span class="lb-score">${e.score}</span></div>`;

}
function handleExamScore(){
  const box=document.getElementById('examLB');if(!box)return;

function submitExamScore(){

async function doSubmitAndRender(box){

  const lb=document.getElementById('lb');
  const tabs=EXAMSETS.map(s=>`<button class="${s.id===setId?'on':''}" onclick="renderLBScreen('${s.id}')">${s.emoji} ${s.name}</button>`).join('');
  lb.innerHTML=`<div class="lb-wrap"><button class="back" onclick="home()">‹ 返回目录</button><h2 style="margin:16px 0 2px;font-size:26px;font-weight:700">🏆 排行榜</h2><div class="lb-tabs">${tabs}</div><div id="lbList"><p class="lb-note">加载中…</p></div><p class="lb-note">${SB_URL?'全网共享榜 · 实时刷新':'本地榜 · 未联网（仅本设备）'}</p></div>`;
  const list=await lbFetch(setId);
  const el=document.getElementById('lbList');if(el)el.innerHTML=lbListHtml(list,null);
}
function restart(){
  if(!pool.length)return home();
  shuffle(pool);i=0;for(const k in grades)delete grades[k];sess={answered:0,correct:0};busy=false;mode='review';
  document.getElementById('done').style.display='none';
  stage.style.display='';document.getElementById('bar').style.display='flex';
  render();window.scrollTo({top:0,behavior:'smooth'});
}
function cp(){const t=document.getElementById('result').textContent;if(navigator.clipboard)navigator.clipboard.writeText(t);const b=event.target;b.textContent='✓ 已复制';setTimeout(()=>b.textContent='📋 复制结果串',1500);}
document.addEventListener('keydown',e=>{
  if(!pool.length||i>=pool.length||busy)return;
  const c=pool[i], k=e.key.toLowerCase();
  if(c.type==='choice'){
    if(document.querySelector('.opt[disabled]'))return;
    let idx=-1;
    if(k>='1'&&k<='9')idx=+k-1; else if(k>='a'&&k<='f')idx=k.charCodeAt(0)-97;
    if(idx>=0&&idx<c.options.length){e.preventDefault();choose(idx);}
    return;
  }
  const flip=document.getElementById('flip');
  if((e.key===' '||e.key==='Enter')&&flip&&!flip.classList.contains('flipped')){e.preventDefault();reveal();return;}
  if(flip&&flip.classList.contains('flipped')&&['1','2','3','4'].includes(k)){
    const b=document.querySelectorAll('.rate.show .rb')[+k-1];if(b){e.preventDefault();b.click();}
  }
});
/* 入口：分享页先进控制台/目录；每日 session 直接开始 */
if(STANDALONE){home();}else{pool=CARDS;render();}
</script></body></html>
