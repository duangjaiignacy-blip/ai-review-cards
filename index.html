"recall","front":"复述：AI 产品拆解六层框架的六个层级、归属及各自核心问题。","cat":"课程","source":"6-22上午 AI产品深度体验与架构拆解","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"产品之外：①市场层——赛道能不能进入、核心竞品是谁占多大份额，决定要不要立项；②商业层——怎么赚钱不亏本、定位与差异化、种子用户从哪来。产品之内：③用户层——目标用户/核心场景/痛点，反推核心功能；④技术层——用什么 AI 技术（PE/Agent/RAG）实现，梳理技术流程；⑤模型层——模型选型+评测+成本核算；⑥数据层（基础层）——依赖哪些数据、使用产生哪些数据、能否形成数据正向循环。","analogy":"像剥洋葱：从外层的市场、商业，一层层剥到核心的数据 🧅"},{"id":"kc-0622am-rc-02","type":"recall","front":"复述：「饭盒」漫剧多 Agent 流水线的主要阶段与各自职责。","cat":"课程","source":"6-22上午 AI产品深度体验与架构拆解","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"共标注 7 个 Agent，默认流水线协作、可回退、每步可确认。①艺术总监·需求承接——抽象角色信息、初始化故事；②艺术总监·需求澄清——确认影片长度/画面比例/对白语言；③艺术总监·风格匹配——用 RAG 匹配漫剧风格、生成 5 个情绪关键词；④编剧 Agent——提炼角色数量/分镜、对应付费规则，付费前用轻量模型；⑤付费节点——按角色计积分，之后调高质量模型；⑥角色设计师——翻译成模型提示词、生成参考图与三视图；⑦分镜师——转场景/音乐提示词、标时间分段、生成并拼接成完整漫剧。","analogy":"像影视剧组：导演、编剧、美术、分镜各司其职，流水线接力出片 🎞️"},{"id":"kc-0622am-rc-03","type":"recall","front":"复述：风格一致性难题的三大核心解法。","cat":"课程","source":"6-22上午 AI产品深度体验与架构拆解","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"①统一情绪关键词——流程开始前提取统一核心情绪词（如悬疑剧用「悬念」），同步用于场景生成、音乐生成等全流程，从源头统一约束；②角色参考图+三视图——给后续生成模型提供风格与多角度参考，解决角色崩坏；③时间分段对齐——给画面/音频/音乐标时间段，解决多模块拼接的节奏对齐。","analogy":"像拍剧统一定调：定个主情绪、备好角色定妆照、给画师统一画风模板 🎨"},{"id":"kc-0622am-rc-04","type":"recall","front":"复述：老师定性 Elise 遇冷的主要原因。","cat":"课程","source":"6-22上午 AI产品深度体验与架构拆解","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"①预社交场景痛点不刚——AI 替代掉了用户最需要、最能获得愉悦感的破冰环节，反而降低真实社交意愿；②信任与数据拿不到——注册强制收集信息但不核心，真正核心的信息用户不愿给、第三方平台也不会开放敏感社交数据，冷启动信任难题基本无解；③AI 能力不足——记忆不串联、语音识别抗干扰差、拟人化低，达不到「复刻第二个自己」；④变现靠融资、用户不付费，叠加留存死亡螺旋。","analogy":"像替你把约会最甜的部分代办了、还要你先交个人隐私，自然没人买账 💔"},{"id":"kc-0622am-rc-05","type":"recall","front":"复述：本周课程核心目标与要产出的全套项目文档。","cat":"课程","source":"6-22上午 AI产品深度体验与架构拆解","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"本周核心目标是带各小组完成小组项目立项、产出全套项目文档。文档顺序为：立项报告→竞品分析→评测文档→模型选型文档→PRD。技术进阶规划本周讲 RAG（约 2-3 天）、Agent 再进阶一次、模型评测；下周由「国国哥」带 web coding 把项目落地；个人项目硬要求是必须做成上线的产品。"},{"id":"kc-0622am-rc-06","type":"recall","front":"复述：模型层在模型选型上的要点与笔记给的两个模型适用举例。","cat":"课程","source":"6-22上午 AI产品深度体验与架构拆解","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"模型层核心是模型选型+模型评测+成本核算：结合场景选适配模型，算清成本（输入、输出、缓存输出定价各不相同），不同模型适用不同场景，后续会带做深度模型评测来为自己产品选合适模型。举例：Sora 2 适合电影级质感视频（报价通常很贵）；GPT Image 适合带思维导图、小插画的图，生成效果好。","analogy":"像配电脑按用途选配件、算好预算，打游戏和剪视频配的不一样 🖥️"},{"id":"kc-0622pm-01","type":"choice","front":"OYO 这款 AIGC 动画产品自上而下分为四层架构，其中「角色库、我的项目、项目协作」属于哪一层？","options":["用户层","应用层","模型层","基础层"],"answer":0,"explain":"角色库/我的项目体现项目管理思维，贴合专业动画从业者的工作场景，属于用户层。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像给设计师配的「我的项目+素材库」，贴着他平时干活的习惯来设计 🗂️"},{"id":"kc-0622pm-02","type":"choice","front":"老师强调 OYO 产品设计自始至终要平衡的两个核心目标是什么？","options":["成本低 + 效果好","速度快 + 功能多","界面美 + 操作简","用户多 + 留存高"],"answer":0,"explain":"贯穿四层架构的核心设计目标始终是「成本低 + 效果好」，这是产品经理必须平衡的两点。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像又要马儿跑、又要马儿少吃草，产品经理天天在这俩之间走钢丝 🐎"},{"id":"kc-0622pm-03","type":"choice","front":"关于 OYO 基础层里的「点赞点踩数据」，下列说法最准确的是？","options":["只用于展示给其他用户参考","主要用于计算用户的付费额度","是产品自我迭代的燃料，用来判断哪些效果保留、哪些改掉","是用来给创作者分成的依据"],"answer":2,"explain":"老师点明点赞点踩数据 = 产品自我迭代的燃料，回流后持续迭代模型与内容。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像饭馆的顾客评价：好评差评都是改进菜单的燃料 👍"},{"id":"kc-0622pm-04","type":"choice","front":"老师反复强调，当前 AIGC 创业更适合走哪条路线？","options":["通用大而全方向","只做海外市场","纯免费抢市场","细分定位路线"],"answer":3,"explain":"老师结论是当前 AIGC 创业更适合细分定位，通用方向很难建立足够厚的产品壁垒。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像小馆子专做一道地方菜反而火，什么都做的大食堂没特色 🍛"},{"id":"kc-0622pm-05","type":"choice","front":"OYO 的护城河 / 产品壁垒主要在哪里？","options":["工程实现与模型路由","表层功能设计与界面交互","巨额广告投放","创始人个人 IP"],"answer":0,"explain":"OYO 的壁垒基本全部在工程实现与模型路由上，而非表层功能设计。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像奶茶店真正难抄的是供应链和配方，不是菜单长啥样 🧋"},{"id":"kc-0622pm-06","type":"choice","front":"多 Agent 协作中，把无前后依赖的任务拆给多个 Agent 同时执行、全部完成后统一汇总，属于哪种协作类型？","options":["串联型","对抗型","并联型","嵌套型"],"answer":2,"explain":"并联型 = 提前拆 to-do list、无依赖任务并行执行后汇总，典型如 Claude 的多 Agent 调研。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像大扫除分头同时干，各扫各的房间，扫完再汇总 🧹"},{"id":"kc-0622pm-07","type":"choice","front":"本次拆解的 OYO 视频生成产品属于哪一种多 Agent 协作类型？","options":["并联型","串联型","对抗型","混合型"],"answer":1,"explain":"OYO 视频生成是典型串联：任务按固定流程顺序执行，前一个完成才进入下一个，流程不可跳跃。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像接力赛：上一棒跑到才能交棒，顺序不能乱 🏃"},{"id":"kc-0622pm-08","type":"choice","front":"OYO 上模型名只写到「Sora 2」这种层级、不明说底层用什么模型，下列哪一项不是老师给出的原因？","options":["防止用户绕过产品直接去调那个模型","对小白屏蔽复杂度","便于用户对比各模型价格自行选择","规避风险（你知我知但不承认用了什么模型）"],"answer":2,"explain":"老师给的三个原因是防绕过、屏蔽复杂度、规避风险；让用户自行对比价格并非目的。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像菜单只写「招牌牛肉」，不告诉你供货商是谁——防同行抄、也省得你纠结 🥩"},{"id":"kc-0622pm-09","type":"choice","front":"Agent 五大核心组件中，「规定大模型如何规划一个任务」的是哪一个组件？","options":["记忆","提示词（System Prompt）","工具","执行"],"answer":1,"explain":"提示词（System Prompt）规定大模型如何规划任务，可理解为「如何规划任务」的规则。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像系统提示词是员工的「工作 SOP 手册」，规定他怎么安排活 📋"},{"id":"kc-0622pm-10","type":"choice","front":"在「表单交互工具 vs 生成式 UI」的对比中，关于开发成本下列哪项符合笔记？","options":["两者开发周期相当","生成式 UI 比表单更省事","表单工具至少要 1 个月","表单工具开发周期通常 ≤1 周，生成式 UI 至少 1 个月"],"answer":3,"explain":"表单交互工具开发周期通常 ≤1 周，生成式 UI 是前沿技术、开发成本高、至少 1 个月。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像填固定表格(几天就能搭) 对比 现场给你量身定制装修(起码一个月) 🏗️"},{"id":"kc-0622pm-11","type":"choice","front":"提示词从 1.0 版到可用的迭代套路，老师强调的正确节奏是？","options":["先精简字数再加规则","先加规则/限制/事例直到稳定，再精简字数，循环迭代","一次写到最完美不再改","字数越少越好，能删就删"],"answer":1,"explain":"迭代节奏 = 写第一版→评测→效果不好就慢慢加规则/限制/事例→稳定后再减字数→持续循环。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像炖汤先多放调料试味，对了再慢慢减，反复调到刚好 🍲"},{"id":"kc-0622pm-12","type":"choice","front":"立项的本质，按课件定义是什么？","options":["一份漂亮的 PPT","一张完整的产品流程图","一份技术架构设计文档","一份「为什么该做」的证据清单"],"answer":3,"explain":"立项 = 一份「为什么该做」的证据清单，给四个问题写答案，不是 PPT 也不是流程图。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像向银行贷款：得拿一摞「为什么靠谱」的证据，不是做几页漂亮 PPT 🏦"},{"id":"kc-0622pm-13","type":"choice","front":"市场规模的 TAM / SAM / SOM 三个圈中，「该跟老板或投资人说的数字」对应哪一个？","options":["TAM 最外圈","SAM 中间圈","SOM 最里圈","三个都一样"],"answer":2,"explain":"SOM（实际能获取）才是该跟老板/投资人说的数字；TAM 讲故事用、SAM 是真正战场。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像卖伞：全城人是 TAM，会下雨买伞的是 SAM，真进你店买的是 SOM(才是跟老板报的数) ☂️"},{"id":"kc-0622pm-14","type":"choice","front":"判断市场增长的「4 个不会骗人的指标」不包括下列哪一项？","options":["融资新闻密度","产品的 UI 美观度","大公司有没有动作","招聘岗位数量"],"answer":1,"explain":"四个增长指标是融资密度、大厂动作、用户讨论、招聘岗位；UI 美观度不在其列。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像看一个行业火不火：有没有人砸钱、大厂动没动、网上聊得多不多、招不招人 🔥"},{"id":"kc-0622pm-15","type":"choice","front":"竞品分析四象限中，与抖音「业务相同、用户相同、抢同样的人」的是哪一类，课件举的例子是？","options":["间接竞品 · 视频号","潜在竞品 · 小红书","直接竞品 · 快手","替代品 · B 站"],"answer":2,"explain":"直接竞品 = 业务相同+用户相同，课件以抖音视角举例为快手（同样的事抢同样的人）。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像你家楼下早餐店：卖一样的东西、抢一样的客人，就是直接对手 🍳"},{"id":"kc-0622pm-16","type":"choice","front":"按「频率 × 痛感」的痛点优先级矩阵，已核实的正确结论是？","options":["高频 + 痛感弱 = 必须解决","高频 + 痛感强 = 必须解决（最高优先级）","低频 + 痛感强 = 必须解决","低频 + 痛感弱 = 必须解决"],"answer":1,"explain":"频率越高 × 痛感越强 = 必须解决；注意官方课件 SLIDE 23 顶行标签写反了，面试一律答高频高痛=必须解决。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"analogy":"像挑毛病先修又常犯又难受的：高频高痛的，必须先解决 🎯"},{"id":"kc-0622pm-qa-01","type":"qa","front":"OYO 模型层为什么要同时用文本、图片、音频、视频四类模型？","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"因为一个模型搞不定 AIGC 动画的全流程。文本模型负责理解需求/生成台词，图片模型生成角色，再到音频和视频生成，需要多模型配合。目标是在视频效果好的同时把成本压低。","analogy":"像拍动画要编剧、画师、配音、剪辑各路人马，一个人干不完全套 🎬"},{"id":"kc-0622pm-qa-02","type":"qa","front":"OYO 的「托管模式」和「对话模式」分别面向什么用户、有何特点？","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"托管模式面向偏小白用户（没有把控能力、只关心最终效果），特点是一句话直接生成最终结果、不需要过程干预。对话模式面向有定制需求的用户，特点是生成过程中可随时通过对话调整内容方向。这两种模式正对应两类目标用户。","analogy":"像理发：托管模式是「你看着办」(小白)，对话模式是边剪边商量(有要求的人) 💈"},{"id":"kc-0622pm-qa-03","type":"qa","front":"Agent 提示词反推法的核心逻辑基础和反推步骤是什么？","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"核心逻辑是大模型/Agent 遵循「输入→处理→输出」三段结构，已知输入和输出就能反推中间的处理逻辑与核心提示词。步骤：①选一个已能运行的目标 Agent；②在不同输入场景下逐步走完并完整记录处理步骤（必须自己人工体验）；③把所有场景逻辑汇总整合；④把目的+处理+输入输出一起发给 AI，让 AI 推导出完整提示词（1.0 版，大概率不能直接用）。","analogy":"像看到一道菜的食材和成品，反推中间是怎么炒出来的 🍳"},{"id":"kc-0622pm-qa-04","type":"qa","front":"在 AI 产品立项中，「AI 负责搜、你负责判断」的分工边界是怎样的？","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"决策绝不能交给 AI，必须小组讨论通过，包括要不要做、选哪些竞品、指定数据源、判断数据可不可信、判断能不能赚钱、痛点真不真、最终拍板并担责。执行可以交给 AI，如让 AI 列竞品候选清单、用你给的报告做分析、去小红书/X 搜定价和用户反馈。此外指定数据源很重要，用户研究和深度竞品体验是 AI 替代不了的。","analogy":"像用搜索引擎查资料可以，但买不买、信不信，得你自己拿主意、自己担责 🔎"},{"id":"kc-0622pm-qa-05","type":"qa","front":"AI 命理产品案例说明了 AI 产品的什么风险？现金流风险的根因是什么？","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"它说明 AI 产品的现金流风险尤其致命：往期学姐用 Claude 一个月开发的 AI 命理产品半个月破 1000 用户、曾有投资人出价约 300 万收购，但最终现金流跑不通而停运。根因是通常给新用户免费体验额度、大部分人体验完不付费，而付费收入要覆盖模型调用成本 + 获客成本，当前小红书获客单用户成本约 2-3 元，转化不足就极易现金流断裂。","analogy":"像网红店爆火却月月亏钱：人气再高，账上没钱照样关门 💸"},{"id":"kc-0622pm-qa-06","type":"qa","front":"benchmark 的定义是什么？为什么说 benchmark 是产品的生命线？","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"benchmark 是一套评估模型/Agent 好坏的标准体系，由评估维度（测什么/评测集）+ 打分规则 + 测试数据集构成，类比高考的考卷加评分体系。它被称为产品生命线，是因为产品核心壁垒来自产品经理的品味（taste），而独特的评估标准本身就是难以复制的核心壁垒，不同 PM 推出的模型适用场景必然不同，最终产品差距还是看品味（但要靠科学评测和迭代来支撑）。","analogy":"像高考的考卷+评分标准，没有它就没法判断模型考得好不好 📝"},{"id":"kc-0622pm-qa-07","type":"qa","front":"竞品分析「选几个竞品」的三档尺度分别对应什么场景？","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"高深度选 1 个，适用单点功能对标、应对突发竞争、资源极度有限（1 人 1 天）。中深度（推荐）选 2-4 个，适用常规产品迭代、商业策略制定、中期战略规划（3 个月）。低深度选 5 个以上，适用行业全景调研、长期战略预判（1 年以上）、大型企业战略扫盘。","analogy":"像研究对手：时间紧只盯 1 个、常规盯 2-4 个、有空摸一整片 🔭"},{"id":"kc-0622pm-qa-08","type":"qa","front":"竞品分析步骤 04「决策判断」的两步动作是什么？","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"第一步列对比表：按 L1 市场/L2 商业/L3 用户三行、按「你我他」（自己与各竞品）三列做对比。第二步写一句话总结，套模板「竞品 X 强在 ___、弱在 ___ → 我们卡 ___ 的差异化锚点」。课件例如：竞品 Perplexity 强在引用透明+实时性、弱在长任务多轮深度，我们卡 Agent 化长任务调研的差异化锚点。","analogy":"像货比三家先列对比表，再用一句话总结「它强在 X、弱在 Y，我打 Z」 📑"},{"id":"kc-0622pm-qa-09","type":"qa","front":"本周作业对用户调研有哪三条硬性要求？","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"①至少 10 个真实用户（班里、朋友都行，但必须真实）；②至少 30 份真实问卷并完成数据分析；③基于问卷结果找 1-2 个目标用户做深度访谈。此外所有用到的数据都必须有明确依据，禁止臆造无来源数据。"},{"id":"kc-0622pm-rc-01","type":"recall","front":"复述：OYO 的四层架构及各层核心构成与作用。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"自上而下四层：①用户层=项目协作/我的项目/角色库，体现项目管理思维、贴合专业动画从业者；②应用层=7 个核心 Agent + 配套工具，支撑视频生成全流程；③模型层=文本/图片/音频/视频四类模型配合，因一个模型搞不定 AIGC 动画；④基础层=风格库/视频知识库/内置影视专业知识 + 用户点赞点踩反馈迭代机制。贯穿目标始终是「成本低 + 效果好」。","analogy":"像一栋楼分四层：门面接客(用户)、车间干活(应用)、发动机(模型)、油库(数据) 🏬"},{"id":"kc-0622pm-rc-02","type":"recall","front":"复述：AI 产品六种主流变现模式（录音版）。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"①订阅制（月/年订阅，OYO 用阶梯式月度订阅）；②按量/按次计费（代表是 API token 按量计费，也可按积分/按次）；③项目制交付（以项目制卖给客户、后续不再额外收费）；④企业 1V1 定制（专给某企业定制、不卖给别人）；⑤效果抽成（按用户降本增效收益抽成）；⑥融资变现（产品全免费、靠投资融资赚钱）。课件 L2 只聚焦其中 4 类：免费增值/订阅/按量/买断。","analogy":"像店铺赚钱的几种姿势：办会员、按次卖、接项目单、卖广告… 💰"},{"id":"kc-0622pm-rc-03","type":"recall","front":"复述：多 Agent 全局共享上下文的两个核心构成与机制本质。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"两个构成：①项目元数据——记录这是个什么项目、版本号、谁更新过什么内容/修改历史，解决多人改文档却不知道改了什么，做统一版本管理；②核心剧本字段——前置 Agent（如编剧）一边推导一边收集的剧本类型/基本信息/风格/角色/分镜等，供后续 Agent 调用以保证角色和场景一致性。机制本质是把共享信息统一维护在一个独立位置，各 Agent 需要时调用工具去查/更新，无需在自己提示词里维护全部信息。","analogy":"像剧组共用一个「项目群+剧本文档」，谁改了啥大家都看得到 📂"},{"id":"kc-0622pm-rc-04","type":"recall","front":"复述：立项书的 6 个上游模块 + 综合环节。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"6 个上游模块：①选题与初筛（候选清单/团队投票/找老师汇报）②用户研究（访谈/Persona/JTBD/痛点矩阵，已学）③市场研究（TAM/SAM/SOM/增长/玩家，今天 CH02）④竞品分析（四象限/六层拆解/痛点四象限/决策，今天 CH03）⑤方案设计（用户旅程图/价值主张/方案草案）⑥可行性评估（技术调研/风险登记册/MVP 范围/资源清单）。第⑦综合环节=立项书本体=北极星指标+里程碑+红线（启动/暂停/终止）。立项书是攒出来的，前 6 模块都是为它服务的证据。","analogy":"像写创业计划书的固定章节：选题、用户、市场、竞品…一节节填 📘"},{"id":"kc-0622pm-rc-05","type":"recall","front":"复述：竞品分析四象限分类（两轴及四类的关系，课件抖音视角例子）。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"两轴=业务（相同/不同）× 用户（相同/不同）。①直接竞品=业务相同+用户相同（同样的事抢同样的人），例快手；②间接竞品=业务相同+用户不同（同样需求不同方案），例视频号；③潜在竞品=业务不同+用户不同（还没全力打但有能力切入），例小红书；④替代品=业务不同+用户相同（不同方式抢同一份时间），例 B 站。0→1 立项时核心分析直接竞品，其他三类也大概率要看一看。","analogy":"像按「做不做同样的事 × 抢不抢同样的人」把对手分成四类 🧭"},{"id":"kc-0622pm-rc-06","type":"recall","front":"复述：今晚作业那个跑 VC IC 级立项报告的 prompt 的铁律。","cat":"课程","source":"6-22下午 OYO拆解与项目立项","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null},"back":"全程必须用联网搜索 Agent、严禁纯模型记忆作答或编造数字；每个数据后必须附完整链接来源、查不到就写「查不到」不准估算；每个判断后必须跟「依据:」一行；能列表格就列表格不写段落；总字数≥3000；输出后单独跑一遍自检清单（每个数字有来源、竞品表≥5 行、用户≥3 子群、痛点≥3 类各带原话、引用清单可点击、字数达标），任何一项 No 就自动补做、不交半成品。3 步用法：每人跑 1-2 方向→组内按⭐排序选最高→把红灯+下一步验证抄进飞书=立项初版明早交。","analogy":"像写论文必须引用真实出处：不准凭记忆瞎编，每个数字都要附链接 🔗"},{"id":"kc-0629-skill-install-path","type":"choice","topic":"MCP/Skill","source":"6-29下午 MCP接入与Skill搭建","cat":"面试","front":"技术面问「Skill 装在哪里」，下列哪组路径是正确的？","options":["Claude Code 项目级 .claude/skills/；Codex 项目级 .codex/skills/","Claude Code 项目级 .cloud/skill/；Codex 项目级 .openai/skills/","两者都只装在 ~/.skills/","Skill 是单个 Markdown 文件，不需要目录"],"answer":0,"back":"Claude Code 项目级在项目根目录 .claude/skills/，用户级在 ~/.claude/skills/；Codex 项目级在 .codex/skills/，用户级在 ~/.codex/skills/。关键要补一句：这些是隐藏路径，知道路径本身就证明你真装过。","explain":"课程强调 Skill 分项目级和用户级，且面试官会用路径验证是否真懂。","analogy":"像面试官问工具放在哪个抽屉，答得出隐藏抽屉位置才像真的用过。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0629-skill-progressive-disclosure","type":"qa","topic":"MCP/Skill","source":"6-29下午 MCP接入与Skill搭建","cat":"面试","front":"Skill 的「渐进式披露」机制是什么？为什么能省 token？","back":"SKILL.md 分头部元数据和正文。AI 第一遍只读所有 Skill 的名称和 description，匹配当前任务后才加载目标 Skill 的完整正文，其余正文不读。收益是减少无关提示词进入上下文，让大量 Skill 能同时安装。","analogy":"像图书馆先看书名和简介，确定要哪本后再翻全文。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0629-skill-token-cost-cc","type":"choice","topic":"MCP/Skill","source":"6-29下午 MCP接入与Skill搭建","cat":"面试","front":"为什么说在 Claude Code 里盲目多装 Skill 反而可能更费 token？","options":["Claude Code 会默认加载挑选 Skill 的内置逻辑，多装会增加筛选和误触发成本","Skill 会自动复制到所有历史会话","Skill 会把所有脚本都联网执行","Skill 只能用图片描述，天然费 token"],"answer":0,"back":"Claude Code 底层有负责挑选 Skill 的内置逻辑，并且开启会话时会加载相关默认项；多装无用 Skill 会增加 token 消耗、拖慢响应，还可能因为 description 相似导致选错。","explain":"课程给出的结论是：不管 MCP 还是 Skill，只装当前真正用得上的。","analogy":"像工具箱塞太满，找锤子前先翻半天，反而慢。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0629-skill-structure","type":"qa","topic":"MCP/Skill","source":"6-29下午 MCP接入与Skill搭建","cat":"面试","front":"一个完整 Skill 可以由哪些部分组成？面试时怎么讲不显得只会背结构？","back":"最小形态是一个文件夹 + SKILL.md；完整形态可扩展 references/、templates/、scripts/。讲法不要只背目录，而要说它像一套 SOP：references 提供参考资料，templates 固定输出结构，scripts 固化验证过的可复用脚本。","analogy":"像奶茶店 SOP：配方、杯型模板、机器步骤都固化，用户点单才触发。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0629-skill-open-source","type":"qa","topic":"求职项目","source":"6-29下午 MCP接入与Skill搭建","cat":"面试","front":"为什么「每天开源一个原创 Skill」能成为 AI 产品经理面试利器？","back":"它把能力外化成可点击、可验证的作品集。个人原创项目比只在简历写「会做 Skill」更有说服力；如果有 README、触发说明、效果截图、迭代记录和 star/测评，就能证明真实落地、持续迭代和社区反馈。","analogy":"像把作品摆到橱窗里，面试官不用听你说，直接能点开看。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0629-skill-remix-flow","type":"recall","topic":"求职项目","source":"6-29下午 MCP接入与Skill搭建","cat":"面试","front":"复述：魔改一个开源 Skill 的四步流程。","back":"① 安装调用：把压缩包解压到目标目录并让 AI 加载；② 删个人信息：移除原作者的个人设定，换成自己的基础信息；③ 加规则权重：把反复出错的格式、风格、禁用表达写成强约束；④ 抽离新需求：把复用能力封装成新的 Skill。","analogy":"像改一份成熟菜谱：先试做，再换成自己的口味，最后沉淀成自家招牌菜。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0629-skill-test-iteration","type":"choice","topic":"求职项目","source":"6-29下午 MCP接入与Skill搭建","cat":"面试","front":"讲 Skill 迭代时，哪些维度最能体现「数据/规则驱动」？","options":["输出风格、正文质量、标题钩子、标签匹配度、正文字数","电脑型号、显示器大小、键盘手感、桌面壁纸","只看是否用了最新模型","只看生成速度，不看内容"],"answer":0,"back":"课程点名的测试维度包括输出内容风格、正文质量、标题钩子、标签匹配度和正文字数。平台规则如小红书/抖音标题长度，也要写进 Skill 后反复测试。","explain":"这能把「我会写提示词」升级成「我会用指标迭代 AI 资产」。","analogy":"像做内容 A/B 测试，不只看好不好看，还看标题、标签、字数是否符合平台。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0630-agent-loop-when","type":"choice","topic":"Harness","source":"6-30上午 Harness框架与Anthropic架构","cat":"面试","front":"什么场景下 Agent 需要进入 Agent Loop？","options":["需求需要调用工具、看结果、再决定下一步，无法靠单次模型输出完成","所有纯文本生成任务都必须进入 Loop","只要用了大模型就必须进入 Loop","只有用户明确说「循环」才进入 Loop"],"answer":0,"back":"当任务需要多轮「调用工具→看结果→再决定下一步」时进入 Agent Loop。简单一次性文本生成不必进循环。","explain":"例如建文件夹并写文件，需要权限、读目录、写入等多工具有序推进。","analogy":"像办手续要先取号、看窗口反馈、再补材料，不是一句话就结束。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0630-harness-definition","type":"qa","topic":"Harness","source":"6-30上午 Harness框架与Anthropic架构","cat":"面试","front":"什么是 Harness？什么是 Agent 产品？","back":"Agent 是能自主规划、自主决策、自主调用工具的系统；Agent 产品 = 大语言模型 + Harness。Harness 是套在模型外、对模型能力做控制和编排的一层，包含循环、工具、权限、钩子等约 20 个环节，本质是在解决上下文、token、幻觉和落地稳定性。","analogy":"像马具套在马身上，让马的力量能被稳定驾驭，而不是乱跑。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0630-hallucination-solution","type":"recall","topic":"Harness","source":"6-30上午 Harness框架与Anthropic架构","cat":"面试","front":"复述：你的 Agent 产品怎么解决幻觉问题？","back":"核心是不要让模型每轮重读几万行上下文。可用多 Agent/子 Agent 分工，分别做信息检索、RAG 检索、输出前校验；用上下文压缩、memory、工作目录隔离拆分不同需求；必要时选择更长上下文模型。重点是用 Harness 编排降低幻觉，而不是只押宝底层模型。","analogy":"像团队写报告，检索、写作、校对分人做，比一个人抱着一堆资料硬写更稳。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0630-subagent-tradeoff","type":"choice","topic":"Harness","source":"6-30上午 Harness框架与Anthropic架构","cat":"面试","front":"决定某个环节要不要拆成 subagent，最该看什么？","options":["独立可复用性、频率、token 成本、难度、对体验影响","只看这个名字听起来高级不高级","所有环节都拆得越细越好","所有环节都不拆，避免复杂"],"answer":0,"back":"拆 subagent 要按需求是否独立可复用、频率、成本、难度、对体验影响取舍。重质量任务可以拆细，重效率的简单任务不必拆。","explain":"课程例子：读桌面可复用，建文件夹这种简单写入未必值得拆。","analogy":"像做饭，切菜可交给助手，但撒盐这一步单独叫人反而慢。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0630-model-version","type":"choice","topic":"模型选型","source":"6-30上午 Harness框架与Anthropic架构","cat":"面试","front":"面试官问「你用的什么模型」时，最容易丢分的回答是什么？","options":["只说 DeepSeek，不说具体版本和选择依据","说清 DeepSeek V4 Pro / Flash 等具体版本","说明做过模型测试","解释版本与产品场景匹配"],"answer":0,"back":"只说「DeepSeek」太粗，会被认为没有实测。要精确到版本号，并说明为什么这个版本能支撑你的 Agent 场景。","explain":"老师明确提醒：说不出具体版本会减分。","analogy":"像说自己开车只说「我开丰田」，但不知道车型和配置。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-claude-hotspot","type":"qa","topic":"Claude Code","source":"7-1上午 求职面试话术与Claude Code核心模块","cat":"面试","front":"如何把 Claude 封禁热点转成 AI 产品经理面试加分点？","back":"不要只抱怨账号风险，而要把它转成产品判断：海外模型不可控会影响 AI Native 团队；但如果能研究 Claude Code 外壳机制，把 Agent 路由、Subagent、权限机制等 Harness 能力迁移到国内模型上，就能降低单一模型依赖，展示研究能力、工程认知、行业眼界和实作能力。","analogy":"像供应商断供，不是只喊惨，而是展示自己有替代供应链方案。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-domestic-model-choice","type":"recall","topic":"模型选型","source":"7-1上午 求职面试话术与Claude Code核心模块","cat":"面试","front":"复述：为什么项目首选国内模型，而不是 GPT / Claude / Grok？","back":"回答三步：① 不是拍脑袋，做过 DeepSeek、小米 MIMO、MiniMax 等模型测试，并参考 OpenRouter 等真实调用量；② 主动规避海外模型封禁和供应链风险，避免用户哪天用不了；③ 通过 Harness 工程给国内模型补 Agent 外壳，提升模型智力和使用率。","analogy":"像公司采购不只看性能，还看供应稳定、成本和可控性。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-context-compression","type":"choice","topic":"上下文工程","source":"7-1上午 求职面试话术与Claude Code核心模块","cat":"面试","front":"关于上下文压缩，下列说法最准确的是？","options":["压缩不是删除，是精简低权重、费 token、对当前任务帮助不大的信息","压缩就是把所有历史都清空","压缩只针对全局长期记忆","压缩会把工具和文件都删掉"],"answer":0,"back":"上下文压缩针对当前单一对话窗口，保留任务目标、角色、核心结论等关键信息，精简冗余工具调用过程、已办结 todo、重复授权等。","explain":"三大价值：降低信息过载和幻觉、降低 token 成本、提升处理速度。","analogy":"像把十页会议记录整理成一页纪要，不是把会议删掉。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-memory-vs-compression","type":"qa","topic":"Memory","source":"7-1上午 求职面试话术与Claude Code核心模块","cat":"面试","front":"Memory 和上下文压缩的一句话区别是什么？","back":"上下文压缩针对当前单一对话窗口，负责给当前窗口瘦身；Memory 针对全局、跨对话窗口，负责长期存储用户关键信息，不受单窗口容量限制。","analogy":"上下文压缩像整理当前行李箱；Memory 像长期保管护照和固定偏好。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-memory-customization","type":"recall","topic":"Memory","source":"7-1上午 求职面试话术与Claude Code核心模块","cat":"面试","front":"复述：为什么 Agent 记忆分类不能照搬 Claude Code 模板？","back":"因为记忆层要服务具体产品场景。Claude Code 的 Project Memory 适合 coding 项目，但角色扮演类 AI 可能更需要情绪记忆和好感度记忆；短剧/声图生成类可能需要镜头语言和视频风格偏好；宠物监控 Agent 可能需要按天记录饮食、排泄、外观变化的日历 Memory。能讲出场景化记忆分类才体现产品思维。","analogy":"像不同岗位的员工档案字段不同，不能拿程序员模板套宠物医生。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-memory-rag-boundary","type":"choice","topic":"Memory","source":"7-1上午 求职面试话术与Claude Code核心模块","cat":"面试","front":"AI 代聊产品里，RAG 知识库和 Memory 的边界应该怎么划？","options":["RAG 存通用领域知识，Memory 存用户专属个性化偏好","RAG 存用户隐私，Memory 存行业模板","两者完全等价，可以混存","只用 RAG，不需要 Memory"],"answer":0,"back":"RAG 适合存所有用户共享的通用风格模板和领域知识；Memory 存个人说话习惯、偏好风格等个性化信息。个人风格要作为可选项单独调用，避免和通用知识混存互相干扰。","explain":"这道题核心是讲清功能定位，不是堆技术名词。","analogy":"RAG 像公共教材，Memory 像每个学生自己的错题本和口味。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-dynamic-system-prompt","type":"qa","topic":"提示词","source":"7-1上午 求职面试话术与Claude Code核心模块","cat":"面试","front":"面试官问「你的 system prompt 怎么写的」，为什么不能只说固定提示词？","back":"因为最终喂给模型的 System Prompt 是动态组装的，通常由三部分拼接：固定基础提示词、当前对话上下文、按需加载的历史 Memory。Subagent 工具描述也可能动态拼入。动态按需拼接能控制长度，避免把全量上下文和全部记忆一股脑塞进去。","analogy":"像做套餐：固定主食 + 当前点单 + 按需加小料，不是每次把全菜单端上桌。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-prompt-cache-cost","type":"choice","topic":"提示词","source":"7-1上午 求职面试话术与Claude Code核心模块","cat":"面试","front":"动态提示词组装为什么有成本优势？","options":["减少冗余 token，按需加载内容，并提高缓存命中率","它会让模型完全免费","它会禁止所有联网搜索","它只适用于图片生成"],"answer":0,"back":"动态组装能减少冗余 token，只在需要时加载相关技能/记忆，提升缓存命中率。命中缓存的请求价格通常远低于未命中请求。","explain":"这是把提示词工程讲到成本结构，而不是停留在格式。","analogy":"像仓库复用常用零件，别每次重新定制整套。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-claude-modules","type":"recall","topic":"Claude Code","source":"7-1上午 求职面试话术与Claude Code核心模块","cat":"面试","front":"复述：用 Claude Code 外壳能力包装项目时，应该传递哪四个能力信号？","back":"① 研究能力：跟进热点、研读顶级项目源码；② 工程认知：懂 Harness，知道 AI 产品能力不只依赖底座模型；③ 行业眼界：关注真实模型调用量和供应链风险；④ 落地实作：能现场演示自己的 Agent 或仓库，不是纸上谈兵。","analogy":"像面试时不只拿证书，还能打开真实作品、解释为什么这么做。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-agent-product-training","type":"qa","topic":"Agent 架构","source":"7-1下午 AI智能体产品知识培训","cat":"面试","front":"如何用「考试」类比讲清 AI Agent 架构？","back":"大模型是大脑；System Prompt 是考生的三观和答题准则；用户任务是试卷；上下文窗口是草稿纸；Memory 是错题本；Skill 是工具使用说明书。这个类比能展示产品经理把复杂技术讲清楚的能力。","analogy":"把 Agent 当成考生，就能快速解释大脑、规则、试卷、草稿纸、错题本和工具书。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-public-sharing","type":"choice","topic":"职业素养","source":"7-1下午 AI智能体产品知识培训","cat":"面试","front":"为什么课堂上台分享能降低正式面试翻车概率？","options":["提前暴露表达和知识盲区，在低成本环境里修正","因为上台后就不用准备项目","因为同学会替你回答面试题","因为面试官只看课堂表现"],"answer":0,"back":"公开表达能提前暴露问题。课堂是低成本练习环境，讲错也没有损失；正式面试前把盲区暴露并修正，才更稳。","explain":"这对应「敢暴露问题、愿意开放讨论」的人设。","analogy":"像正式演出前彩排，错在彩排比错在舞台上划算。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-no-closed-door","type":"qa","topic":"职业素养","source":"7-1下午 AI智能体产品知识培训","cat":"面试","front":"面试被问「产品经理最怕什么」时，如何用本课观点回答？","back":"产品经理最怕闭门造车。我的习惯是把想法抛出来和团队讨论，欢迎别人质疑；讨论中别人给出我没想到的角度，本质是在补全我的认知。产品经理要主动暴露不确定，而不是假装全知。","analogy":"像做地图，一个人画容易漏路，多人对照才知道哪里没标。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-context-management-4step","type":"recall","topic":"上下文工程","source":"7-1下午 AI智能体产品知识培训","cat":"课程","front":"复述：上下文窗口不够用时的四步管理法。","back":"先把溢出当前窗口的旧内容转存到外部空间；当前窗口只保留开头核心任务和最近任务内容；给转存内容建索引，按需跳转调取；容量仍不足时，再调用大模型对旧内容做汇总压缩。成本策略是先用低成本的转存和索引，最后再动用付费总结压缩。","analogy":"像书桌放不下，先把旧资料归档、留目录，真需要再翻出来。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-skill-on-demand","type":"choice","topic":"Agent 架构","source":"7-1下午 AI智能体产品知识培训","cat":"课程","front":"Skill 的按需加载和上下文压缩最大的区别是什么？","options":["Skill 是延迟加载完整内容，不损失信息；压缩会精简信息","Skill 会删除原始内容；压缩完整保留全文","两者完全一样","Skill 只能用于图片，压缩只能用于代码"],"answer":0,"back":"Skill 初始只暴露名称和描述，匹配需求后才完整加载正文；它不压缩、不损失原文。上下文压缩则会对已有内容做精简。","explain":"这能体现对 Token 经济学和渐进式披露的理解。","analogy":"Skill 像需要时才打开说明书；压缩像把说明书摘要成小抄。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-career-granularity","type":"qa","topic":"求职面试","source":"7-1分享会 AI产品求职与职场发展","cat":"面试","front":"AI 产品经理面试中，「做事颗粒度」怎么讲才有说服力？","back":"任何项目都用「问题怎么发现的 → 有哪些可选方案 → 为什么这么选 → 上线后数据结果如何 → 遇到问题怎么调整」五段式讲。不要只说「提升了转化率」这种空泛结果，颗粒度越细，越能体现真实做过和复盘能力。","analogy":"像讲破案过程，要说线索、嫌疑方案、取舍、证据和复盘，而不是只说破案了。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-unknown-question","type":"choice","topic":"求职面试","source":"7-1分享会 AI产品求职与职场发展","cat":"面试","front":"面试遇到不会的问题，最推荐的做法是什么？","options":["不硬答，主动引导到自己熟悉的领域，并在面试后复盘补齐","立刻编一个听起来高级的答案","直接说这个问题不重要","沉默等面试官换题"],"answer":0,"back":"不要硬答。可以把话题引导到自己熟悉或擅长的领域展示能力；面试结束后立刻复盘不会的问题，还可在后续面试中反问别的面试官收集行业答案。","explain":"核心不是全知，而是会控场、会复盘、会持续补齐。","analogy":"像走到不熟的路口，先回到熟悉主路，再回家补地图。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-toy-project","type":"qa","topic":"求职面试","source":"7-1分享会 AI产品求职与职场发展","cat":"面试","front":"练手项目没上线或规模小，会被当成「玩具」吗？怎么答？","back":"不会。成熟产品早期也常只服务小范围用户。只要能满足具体用户需求，就是合格产品。面试时重点讲你对用户需求的理解、完整链路和迭代，而不是纠结规模。","analogy":"像餐厅试营业先服务一条街，能解决真实需求就不是玩具。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-transition-advantage","type":"choice","topic":"求职面试","source":"7-1分享会 AI产品求职与职场发展","cat":"面试","front":"传统产品/其他背景转 AI 产品，如何包装成优势？","options":["没有旧产品思维包袱，更能拥抱 AI 新玩法，并用快速上手案例证明","承认自己完全没有优势","只强调工作年限更久","避开这个话题不答"],"answer":0,"back":"企业核心考察能否拥抱变化，而不是传统工作年限。AI 产品没有成熟经验可照搬，新人/转型者如果能快速学习和落地，反而可以讲成优势。","explain":"关键要补真实案例，不能只喊口号。","analogy":"像新赛道开赛，少背旧地图的人反而更容易按新规则跑。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-resume-user-understanding","type":"qa","topic":"简历作品集","source":"7-1分享会 AI产品求职与职场发展","cat":"面试","front":"AI 产品经理简历为什么不能只堆技术关键词？","back":"AI 时代稀缺的是「懂用户、能把 AI 用到真实场景」。简历里补一句你对目标场景用户的理解，往往比三五行技术关键词更有竞争力。过往任何用户经验都可以包装成 AI 时代的独特价值。","analogy":"像厨师简历不只写会用刀，还要写懂哪类食客。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0701-boss-disagreement","type":"recall","topic":"职场情境题","source":"7-1分享会 AI产品求职与职场发展","cat":"面试","front":"复述：你和老板方向判断不同，面试中怎么答？","back":"同时做 A（老板要求）+ B（你看好）两个 Demo。先满足老板要求，再用数据、逻辑和 Demo 展示自己方案的优势；如果与上级绩效冲突，则谨慎推进。重点是用可验证方案沟通，而不是空口争论。","analogy":"像路线有分歧时，先给出两条路线的小样和时间成本，让对方看着选。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0702-agent-reach-nature","type":"choice","topic":"Agent-Reach","source":"7-2下午 Agent-Reach拆解与面试话术","cat":"面试","front":"Agent-Reach 项目的本质更接近哪一种？","options":["单 Agent 循环 + 第三方工具缝合","真正复杂的多智能体自治组织","只调用一个商业搜索 API","纯手写爬虫框架，不依赖外部工具"],"answer":0,"back":"课程拆解结论：Agent-Reach 并非网传多智能体架构，而是单 Agent loop 加大量第三方现成工具的整合调度，本体主要做下载、调度手册和可用性维护。","explain":"产品经理要能拆穿「听起来很高级」和「实际能解决问题」之间的差别。","analogy":"像一个总调度员带一堆外包师傅干活。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0702-crawl-options","type":"recall","topic":"Agent-Reach","source":"7-2下午 Agent-Reach拆解与面试话术","cat":"面试","front":"复述：AI 爬取/检索类开放题的三方案对比。","back":"方案 A：官方搜索 API，稳定但成本高；方案 B：MCP 工具如 Apify，覆盖平台广、精准但贵且耗 token；方案 C：复用开源项目如 Agent-Reach，免费高性价比，但有停更、依赖工具断链、结果无校验和账号风险。","analogy":"像出行三选一：打车稳但贵，包车更贵更定制，骑共享车便宜但要自担风险。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0702-agent-reach-risks","type":"choice","topic":"Agent-Reach","source":"7-2下午 Agent-Reach拆解与面试话术","cat":"面试","front":"下列哪项不是 Agent-Reach 这类开源爬虫项目的主要风险？","options":["作者或依赖工具停更导致链路断","Cookie 爬取把封号风险转嫁给用户","只保证能抓，不保证抓得对和全","所有平台官方都明确授权免费高频爬取"],"answer":3,"back":"主要风险包括更新无保障、安装复杂、数据质量无保证、封号风险转嫁用户。不是所有平台都授权免费高频爬取。","explain":"面试中要主动讲风险，才显得不是盲目追热点。","analogy":"像借别人的梯子爬墙，梯子坏了、墙不让爬、摔下来都得自己承担。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0702-agent-reach-answer","type":"qa","topic":"Agent-Reach","source":"7-2下午 Agent-Reach拆解与面试话术","cat":"面试","front":"AI 爬取/检索类开放题，标准回答结构是什么？","back":"先做多方案对比，展示产品力和兜底思维；再做二次优化整合，剥离劣势、提取优势模块；然后补 subagent 结果校验，把「能抓」升级成「抓得准」；最后展示真实成果，例如优化版已发布到自己的 GitHub，可现场投屏演示。","analogy":"像面试不是只说我会做菜，而是先比菜谱、再改良、再端出成品让对方尝。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0702-subagent-validation","type":"choice","topic":"Agent-Reach","source":"7-2下午 Agent-Reach拆解与面试话术","cat":"面试","front":"在 Agent-Reach 基础上补一个 subagent，主要补齐哪块能力？","options":["对爬取结果做分析和校验，提升准确率","把所有平台账号公开","把免费工具全部替换成付费 API","删除 Agent loop"],"answer":0,"back":"原项目只做意图识别和 Agent loop 调工具检索，缺少结果校验。补 subagent 校验后，可以让输出更可信，并进入下一轮 loop 修正错误。","explain":"这也是把开源项目包装成自己可验证作品的关键。","analogy":"像快递员负责取件，质检员负责确认拿回来的是不是对的。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0702-interviewer-evaluates","type":"recall","topic":"求职面试","source":"7-2下午 Agent-Reach拆解与面试话术","cat":"面试","front":"复述：开放性 AI 方案题，面试官真正听的四项能力是什么？","back":"① 产品力/多方案兜底能力：至少几条路，A 被成本卡死有 B 兜底；② 持续学习能力/AI 视野：能讲最近一两周研究了什么；③ 落地能力：真的做了、优化了、发布了、可验证；④ 拆解分析能力：能讲热门项目的优势、劣势、质疑点和迭代方式。","analogy":"像面试官不是只看答案对不对，而是看你怎么拆题、找路、落地和复盘。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}},{"id":"kc-0702-resource-close","type":"qa","topic":"求职面试","source":"7-2下午 Agent-Reach拆解与面试话术","cat":"面试","front":"开放题收尾时，为什么要讲「我要什么 + 我能给什么」？","back":"这能把方案落到真实资源和产出上。例如做多平台爬取，要公司准备多个平台账号轮换；你能给的是 7x24 小时运行、成本更低、效率更快、并带校验的检索能力。它比只讲技术路线更像产品负责人。","analogy":"像项目立项最后要说预算、人力和交付，不只讲愿景。","srs":{"ease":2.5,"interval":0,"reps":0,"lapses":0,"due":null,"last":null}}];

CARDS.push(...JULY6_CARDS);
const STANDALONE=true;
const FAST_MS=6000, LS_KEY='kun_review_v3';
/* 全网排行榜后端（Supabase）：填了就走全网榜，留空则本地榜兜底 */
const SB_URL='', SB_KEY='';
/* 多难度套卷 */
const EXAMSETS=[
  {id:'basic',     name:'基础卷',     emoji:'📘', n:15, pass:80, cat:'all',       desc:'15 题 · 跨主题 · 合格线 80'},
  {id:'interview', name:'面试冲刺卷', emoji:'🎯', n:20, pass:80, cat:'interview', desc:'20 题 · 全面试题库 · 合格线 80'},
  {id:'challenge', name:'全能挑战卷', emoji:'🔥', n:30, pass:90, cat:'all',       desc:'30 题 · 最高难度 · 合格线 90'},
  {id:'timed',     name:'限时挑战卷', emoji:'⚡', n:20, pass:80, cat:'all', timed:true, perSec:15, desc:'20 题 · 每题 15 秒 · 准确率×速度计分'},
];
let pool=[], i=0, busy=false, mode='review', cardShownAt=0, examTimer=null, qDeadline=0; const grades={};
let fCat='all', fType='all', fTopic=null, limitN=20, includeMastered=false;
let sess={answered:0,correct:0}, examLog=[], curSet=null, lastExam=null;
let store=loadStore();
const stage=document.getElementById('stage'), prog=document.getElementById('prog'),
      nav=document.getElementById('nav'), hm=document.getElementById('hm');
const TYPE={qa:'翻卡自测',choice:'选择题',recall:'必背填空'};
const TLABEL={all:'全部题型',flip:'翻卡自测',choice:'选择题'};
const CATLABEL={all:'全部',course:'日常知识',interview:'面试题库'};
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function shuffle(a){for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]];}return a;}
function isFlip(c){return c.type!=='choice';}
function lvl(c){return store.mastery[c.id]||0;}

/* ---------- 本地存储：熟练度 + 累计统计 ---------- */
function freshStore(){return {mastery:{},stats:{answered:0,correct:0},exam:{bestBySet:{}},name:'',lb:{}};}
function loadStore(){try{const j=JSON.parse(localStorage.getItem(LS_KEY));if(j&&j.mastery&&j.stats){j.exam=j.exam||{bestBySet:{}};j.exam.bestBySet=j.exam.bestBySet||{};j.lb=j.lb||{};if(typeof j.name!=='string')j.name='';return j;}}catch(e){}return freshStore();}
function saveStore(){try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){}}
function resetStore(){if(!confirm('清空所有学习记录（正确率 / 已通关 / 最佳成绩 / 本地榜）？此操作不可撤销。'))return;store=freshStore();saveStore();document.getElementById('setup').innerHTML=setupHtml();}
function bestScore(){const v=Object.values(store.exam.bestBySet||{});return v.length?Math.max.apply(null,v):0;}
function bumpStats(ok){store.stats.answered++;if(ok)store.stats.correct++;sess.answered++;if(ok)sess.correct++;saveStore();}
function setMastery(c,ok,fast,strong){
  let v=lvl(c);
  if(!ok)v=0; else v=Math.min(5, v + (strong?3:(fast?2:1)));
  store.mastery[c.id]=v; saveStore();
}

/* ---------- 过滤：类别 / 题型 / 已掌握 ---------- */
function catMatch(c,k){k=k||fCat;return k==='all'||(k==='interview'&&c.cat==='面试')||(k==='course'&&c.cat!=='面试');}
function typeMatch(c,t){t=t||fType;return t==='all'||(t==='flip'&&isFlip(c))||(t==='choice'&&c.type==='choice');}
function notMastered(c){return includeMastered||lvl(c)<5;}
function match(c){return catMatch(c)&&typeMatch(c)&&notMastered(c);}

/* ---------- 控制台 / 目录 ---------- */
function topicCounts(){const m={};CARDS.forEach(c=>{if(!match(c))return;const t=c.topic||'其他';m[t]=(m[t]||0)+1;});return m;}
function availCount(){return CARDS.filter(match).length;}
function masteredCount(){return Object.values(store.mastery).filter(v=>v>=5).length;}
function statbarHtml(){
  const s=store.stats, acc=s.answered?Math.round(s.correct/s.answered*100):0;
  return `<div class="statbar"><span>累计 <b>${s.answered}</b> 题</span><span>正确率 <b>${acc}%</b></span><span>已通关 <b>${masteredCount()}</b> 张</span><span>最佳模拟考 <b>${bestScore()}</b> 分</span><button class="reset" onclick="resetStore()">清空记录</button></div>`;
}
function setupHtml(){
  const tc=topicCounts();
  const topics=Object.keys(tc).sort((a,b)=>tc[b]-tc[a]||a.localeCompare(b,'zh'));
  const seg=Object.keys(TLABEL).map(t=>`<button class="${fType===t?'on':''}" onclick="setType('${t}')">${TLABEL[t]}</button>`).join('');
  const ns=[[10,'10 题'],[20,'20 题'],[50,'50 题'],[0,'全部']].map(([n,l])=>`<button class="${limitN===n?'on':''}" onclick="setN(${n})">${l}</button>`).join('');
  const toc=topics.map(t=>`<button class="toc-item" onclick="startTopic('${encodeURIComponent(t)}')"><span>${esc(t)}</span><em>${tc[t]}</em></button>`).join('');
  const catN={all:CARDS.filter(c=>notMastered(c)).length,course:CARDS.filter(c=>c.cat!=='面试'&&notMastered(c)).length,interview:CARDS.filter(c=>c.cat==='面试'&&notMastered(c)).length};
  const catSeg=Object.keys(CATLABEL).map(k=>`<button class="${fCat===k?'on':''}" onclick="setCat('${k}')">${CATLABEL[k]}<span class="seg-n">${catN[k]}</span></button>`).join('');
  const avail=availCount();
  const cntTxt=(limitN&&limitN<avail)?(limitN+' 题'):('全部 '+avail+' 题');
  const mc=masteredCount();
  const mrow=mc?`<div class="mastered-row"><button class="toggle-chip ${includeMastered?'on':''}" onclick="toggleMastered()">${includeMastered?'✓ 已包含':'已隐藏'} ${mc} 张「已掌握」卡 · 点击${includeMastered?'隐藏':'找回'}</button></div>`:'';
  return statbarHtml()+
    `<div class="seg-wrap"><div class="seg-label">类别</div><div class="seg seg-cat">${catSeg}</div></div>`+
    `<div class="seg-wrap"><div class="seg-label">题型</div><div class="seg">${seg}</div></div>`+
    `<div class="seg-wrap"><div class="seg-label">题量 · 本轮随机抽取（熟练度高的少出）</div><div class="chips">${ns}</div></div>`+
    mrow+
    `<button class="start-btn" onclick="startAll()">开始复习 · ${CATLABEL[fCat]} · ${TLABEL[fType]} · ${cntTxt} →</button>`+
    `<div class="seg-label toc-h">📝 模拟考试中心 · 冲榜</div>`+
    `<div class="exam-sets">`+EXAMSETS.map(s=>{
      const best=(store.exam.bestBySet||{})[s.id]||0;
      return `<button class="exam-card" onclick="startExam('${s.id}')"><div class="ec-top"><span class="ec-emoji">${s.emoji}</span><span class="ec-name">${s.name}</span><span class="ec-best">最佳 ${best}</span></div><div class="ec-desc">${s.desc}</div></button>`;
    }).join('')+`</div>`+
    `<button class="lb-btn" onclick="showLeaderboard(null)">🏆 查看排行榜${SB_URL?'':'（本地）'}</button>`+
    `<div class="seg-label toc-h">目录 · 点知识点直接开练（${CATLABEL[fCat]} · ${topics.length} 个主题）</div>`+
    `<div class="toc">${toc}</div>`;
}
function rerenderSetup(){document.getElementById('setup').innerHTML=setupHtml();}
function setCat(k){fCat=k;rerenderSetup();}
function setType(t){fType=t;rerenderSetup();}
function setN(n){limitN=n;rerenderSetup();}
function toggleMastered(){includeMastered=!includeMastered;rerenderSetup();}
function home(){
  clearQTimer();mode='review';i=0;busy=false;pool=[];
  document.getElementById('done').style.display='none';
  document.getElementById('doneExam').style.display='none';
  document.getElementById('doneReview').style.display='block';
  document.getElementById('bar').style.display='none';
  document.getElementById('lb').style.display='none';
  stage.style.display='none';
  prog.style.width='0%';nav.textContent='';
  const s=document.getElementById('setup');s.style.display='block';s.innerHTML=setupHtml();
  hm.textContent='选择题型与题量';
  window.scrollTo({top:0,behavior:'smooth'});
}
function startAll(){start(fType,null,limitN);}
function startTopic(enc){start(fType,decodeURIComponent(enc),0);}
function weightedPick(cands,n){
  const arr=cands.slice(), out=[]; n=Math.min(n,arr.length);
  while(out.length<n&&arr.length){
    let tot=0; const ws=arr.map(c=>{const w=6-lvl(c);tot+=w;return w;});
    let r=Math.random()*tot,k=0; while(k<arr.length&&(r-=ws[k])>0)k++; if(k>=arr.length)k=arr.length-1;
    out.push(arr.splice(k,1)[0]);
  }
  return out;
}
function start(type,topic,n){
  mode='review';fType=type;fTopic=topic;
  const cand=CARDS.filter(c=>catMatch(c,fCat)&&typeMatch(c,type)&&notMastered(c)&&(!topic||((c.topic||'其他')===topic)));
  if(!cand.length){alert('该筛选下暂时没有卡片（可能都已掌握）。换个题型/类别，或在首页点「找回已掌握卡」。');return;}
  if(n&&n>0)pool=weightedPick(cand,n);
  else{pool=cand.slice();pool.sort((a,b)=>(lvl(a)-lvl(b))||(Math.random()-0.5));}
  beginRun();
  document.getElementById('segBar').innerHTML=Object.keys(TLABEL).map(t=>`<button class="${fType===t&&!fTopic?'on':''}" onclick="start('${t}',null,limitN)">${TLABEL[t]}</button>`).join('');
}
function stratExam(ch,n){
  const byT={};ch.forEach(c=>{(byT[c.topic||'其他']=byT[c.topic||'其他']||[]).push(c);});
  Object.values(byT).forEach(shuffle);
  const order=shuffle(Object.keys(byT)); const out=[]; let added=true;
  while(out.length<n&&added){added=false;for(const t of order){if(out.length>=n)break;if(byT[t].length){out.push(byT[t].pop());added=true;}}}
  return shuffle(out);
}
function clearQTimer(){if(examTimer){clearInterval(examTimer);examTimer=null;}}
function startQTimer(){
  clearQTimer();
  const limit=curSet.perSec*1000; qDeadline=Date.now()+limit;
  const bar=document.getElementById('qbar'), sec=document.getElementById('qsec');
  examTimer=setInterval(()=>{
    const rem=qDeadline-Date.now(), f=Math.max(0,rem/limit);
    if(bar){bar.style.width=(f*100)+'%';bar.style.background=f<0.3?'var(--warn)':'var(--accent)';}
    if(sec)sec.textContent=Math.max(0,Math.ceil(rem/1000))+'s';
    if(rem<=0){clearQTimer();onTimeout();}
  },80);
}
function onTimeout(){
  if(busy)return;busy=true;
  const c=pool[i], opts=document.querySelectorAll('.opt');
  opts.forEach((o,k)=>{o.onclick=null;o.setAttribute('disabled','');o.classList.add('dim');if(k===c.answer){o.classList.add('correct');o.classList.remove('dim');}});
  const ans=document.getElementById('ans');if(ans)ans.classList.add('show');
  setMastery(c,false,false,false);bumpStats(false);
  examLog.push({front:c.front,correct:false,picked:-1,answer:c.answer,options:c.options,points:0});
  setTimeout(()=>{i++;render();},1100);
}
function startExam(setId){
  const set=EXAMSETS.find(s=>s.id===setId)||EXAMSETS[0]; curSet=set;
  const ch=CARDS.filter(c=>c.type==='choice'&&(set.cat==='all'||catMatch(c,set.cat)));
  if(ch.length<3){alert('该套卷选择题数量不足，无法组卷。');return;}
  pool=stratExam(ch, Math.min(set.n,ch.length)); mode='exam'; fTopic=null;
  beginRun();
  document.getElementById('segBar').innerHTML=`<span class="exam-flag">${set.emoji} ${set.name}</span>`;
}
function beginRun(){
  clearQTimer();
  i=0;for(const k in grades)delete grades[k];examLog=[];sess={answered:0,correct:0};busy=false;
  document.getElementById('setup').style.display='none';
  document.getElementById('done').style.display='none';
  stage.style.display='';
  document.getElementById('bar').style.display='flex';
  render();window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- 卡片渲染 ---------- */
function topHtml(c){return `<div class="card-top"><span class="idx">CARD <em>${pad(i+1)}</em> / ${pad(pool.length)}</span><span class="ctype">${TYPE[c.type]||c.type}</span></div>`+
  `<div class="tags">${c.topic?'<span class="pill">'+esc(c.topic)+'</span>':''}${c.source?'<span class="pill">'+esc(c.source)+'</span>':''}</div>`;}
function knownBtn(){return mode==='exam'?'':`<button class="known-btn" onclick="master()">✓ 这题我熟了，以后少出现</button>`;}
function render(){
  if(i>=pool.length){return mode==='exam'?examFinish():finish();}
  const c=pool[i];
  prog.style.width=(i/pool.length*100)+'%';
  nav.textContent=`${pad(i+1)} / ${pad(pool.length)}`;
  hm.textContent=(mode==='exam'?'模拟考试 ':'进行中 ')+`${pad(i+1)}/${pad(pool.length)}`;
  const bc=document.getElementById('barCount');if(bc)bc.textContent=`${pad(i+1)} / ${pad(pool.length)}`;
  const timed=mode==='exam'&&curSet&&curSet.timed;
  let h;
  if(c.type==='choice'){
    let opts='<div id="opts">';
    c.options.forEach((o,idx)=>{opts+=`<button class="opt" style="animation-delay:${idx*55}ms" data-k="${idx}" onclick="choose(${idx})"><span class="key">${String.fromCharCode(65+idx)}</span><span>${esc(o)}</span></button>`;});
    opts+='</div>';
    const timer=timed?`<div class="qtimer"><i id="qbar"></i></div><div class="qsec" id="qsec"></div>`:'';
    h=`<article class="card anim">${topHtml(c)}${timer}<div class="q">${esc(c.front)}</div>${opts}`+
      `<div class="answer" id="ans"><span class="alabel">解析</span>${esc(c.explain||c.back||'')}${c.analogy?'<div class="analogy"><span class="albl">🌰 生活类比</span>'+esc(c.analogy)+'</div>':''}</div>`+
      `<div class="rate" id="rate"></div>${knownBtn()}</article>`;
  }else{
    const front=`<article class="card">${topHtml(c)}<div class="q">${esc(c.front)}</div>`+
      `<button class="reveal-btn" onclick="reveal()">翻看答案<span class="kc">SPACE</span></button>`+
      `<div class="hint">先在心里默答，再按 SPACE 翻卡，按真实掌握度评级（1–4）</div>${knownBtn()}</article>`;
    const back=`<article class="card">${topHtml(c)}<div class="q qb">${esc(c.front)}</div>`+
      `<div class="answer show"><span class="alabel">答案</span>${esc(c.back)}${c.analogy?'<div class="analogy"><span class="albl">🌰 生活类比</span>'+esc(c.analogy)+'</div>':''}</div>`+
      `<div class="rate show">
        <button class="rb r0" onclick="grade(0)">忘了<span class="kc">1</span></button>
        <button class="rb r1" onclick="grade(1)">难<span class="kc">2</span></button>
        <button class="rb r2" onclick="grade(2)">会<span class="kc">3</span></button>
        <button class="rb r3" onclick="grade(3)">简单<span class="kc">4</span></button></div></article>`;
    h=`<div class="flip anim" id="flip"><div class="flip-inner" id="flipInner"><div class="face">${front}</div><div class="face back">${back}</div></div></div>`;
  }
  stage.innerHTML=h; busy=false; cardShownAt=Date.now();
  if(c.type!=='choice') syncFlip();
  if(timed&&c.type==='choice') startQTimer();
}
function syncFlip(){
  const fi=document.getElementById('flipInner');if(!fi)return;
  const faces=fi.querySelectorAll('.face');
  const fh=faces[0].firstElementChild.offsetHeight, bh=faces[1].firstElementChild.offsetHeight;
  fi.style.transition='none'; fi.style.height=fh+'px'; void fi.offsetWidth; fi.style.transition='';
  fi._bh=bh;
}
function reveal(){
  const flip=document.getElementById('flip');if(!flip||flip.classList.contains('flipped'))return;
  const fi=document.getElementById('flipInner');if(fi._bh)fi.style.height=fi._bh+'px';
  flip.classList.add('flipped');
}
function master(){
  if(busy)return;busy=true;
  store.mastery[pool[i].id]=5;saveStore();
  const top=stage.firstElementChild;if(top)top.classList.add('leaving');
  i++;setTimeout(render,240);
}
function next(){const top=stage.firstElementChild;if(top)top.classList.add('leaving');i++;setTimeout(render,260);}
function choose(idx){
  const c=pool[i], dt=Date.now()-cardShownAt, correct=idx===c.answer;
  const opts=document.querySelectorAll('.opt');
  opts.forEach((o,k)=>{o.onclick=null;o.setAttribute('disabled','');o.classList.add('dim');if(k===c.answer){o.classList.add('correct');o.classList.remove('dim');}});
  if(!correct){opts[idx].classList.add('wrong');opts[idx].classList.remove('dim');}
  document.getElementById('ans').classList.add('show');
  setMastery(c,correct,dt<FAST_MS,false); bumpStats(correct);
  if(mode==='exam'){
    let points;
    if(curSet&&curSet.timed){
      clearQTimer();
      const limit=curSet.perSec*1000, rem=Math.max(0,qDeadline-Date.now());
      points = correct ? (100/pool.length)*(0.5+0.5*rem/limit) : 0;
    }
    examLog.push({front:c.front,correct,picked:idx,answer:c.answer,options:c.options,points:points||0});
    busy=true;setTimeout(()=>{i++;render();},(curSet&&curSet.timed)?650:950);return;
  }
  const rate=document.getElementById('rate');rate.classList.add('show');
  if(correct){rate.innerHTML='<button class="rb r2" onclick="next()">答对·会<span class="kc">3</span></button><button class="rb r3" onclick="master()">太简单·别再考<span class="kc">4</span></button>';}
  else{rate.innerHTML='<button class="rb r0" onclick="next()">答错·忘了<span class="kc">1</span></button><button class="rb r1" onclick="next()">答错·有印象<span class="kc">2</span></button>';}
}
function grade(g){
  if(busy)return;busy=true;
  const c=pool[i];grades[c.id]=g;
  if(c.type!=='choice'){const dt=Date.now()-cardShownAt;setMastery(c,g>=2,dt<FAST_MS,g===3);bumpStats(g>=2);}
  const top=stage.firstElementChild;if(top)top.classList.add('leaving');
  i++;setTimeout(render,260);
}
function finish(){
  prog.style.width='100%';nav.textContent=`${pad(pool.length)} / ${pad(pool.length)}`;hm.textContent='已完成';
  stage.style.display='none';document.getElementById('bar').style.display='none';
  document.getElementById('doneExam').style.display='none';
  document.getElementById('doneReview').style.display='block';
  const vals=Object.values(grades);
  const ok=vals.filter(g=>g>=2).length, again=vals.filter(g=>g===0).length;
  const acc=sess.answered?Math.round(sess.correct/sess.answered*100):'—';
  document.getElementById('donestat').innerHTML=
    `<div class="stat"><b>${pad(vals.length)}</b><span>已复习</span></div>`+
    `<div class="stat hi"><b>${acc}${sess.answered?'%':''}</b><span>本轮正确率</span></div>`+
    `<div class="stat ok"><b>${pad(ok)}</b><span>掌握</span></div>`+
    `<div class="stat again"><b>${pad(again)}</b><span>需重背</span></div>`;
  document.getElementById('result').textContent=Object.entries(grades).map(([k,v])=>k+':'+v).join(',');
  document.getElementById('done').style.display='block';
  if(STANDALONE){
    const r=document.getElementById('result'), rl=r.previousElementSibling;
    if(rl)rl.style.display='none'; r.style.display='none';
    const cpb=document.querySelector('#doneReview .copy'); if(cpb)cpb.style.display='none';
    const sub=document.querySelector('#doneReview .done-sub');
    if(sub)sub.textContent='公开随时复习页 · 进度按本设备本地保存。可「再来一轮」打乱，或返回目录换题型/知识点。';
    const dc=document.getElementById('doneReview');
    let ag=document.getElementById('againBtn');
    if(!ag){ag=document.createElement('button');ag.id='againBtn';ag.className='copy';ag.onclick=restart;dc.appendChild(ag);}
    ag.textContent='🔁 再来一轮（打乱）';
    let bk=document.getElementById('homeBtn');
    if(!bk){bk=document.createElement('button');bk.id='homeBtn';bk.className='copy';bk.style.cssText='margin-left:8px;background:var(--bg);color:var(--text);border:1.5px solid var(--border)';bk.onclick=home;dc.appendChild(bk);}
    bk.textContent='← 返回目录';
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
function examFinish(){
  clearQTimer();
  const set=curSet||EXAMSETS[0];
  const total=examLog.length, correct=examLog.filter(e=>e.correct).length;
  const score=set.timed?Math.round(examLog.reduce((s,e)=>s+(e.points||0),0)):(total?Math.round(correct/total*100):0);
  const pass=score>=set.pass;
  store.exam.bestBySet=store.exam.bestBySet||{};
  if(score>(store.exam.bestBySet[set.id]||0)){store.exam.bestBySet[set.id]=score;saveStore();}
  lastExam={setId:set.id,setName:set.name,score,correct,total};
  prog.style.width='100%';hm.textContent='考试结束';nav.textContent=`${pad(total)} / ${pad(total)}`;
  stage.style.display='none';document.getElementById('bar').style.display='none';
  const wrong=examLog.filter(e=>!e.correct);
  const L='ABCDEFGH';
  const wl=wrong.length
    ?`<div class="wrong-list"><div class="wl-h">错题回顾 · ${wrong.length} 题</div>`+wrong.map(e=>`<div class="wrong-item"><b>${esc(e.front)}</b>你选 ${L[e.picked]} ｜ 正确 ${L[e.answer]}：${esc(e.options[e.answer]||'')}</div>`).join('')+`</div>`
    :'<p class="done-sub" style="margin-top:18px">满分通过，全部答对 🎉</p>';
  const de=document.getElementById('doneExam');
  de.innerHTML=`<div class="eyebrow" style="margin-bottom:8px">${set.emoji} ${esc(set.name)} · EXAM RESULT</div>`+
    `<div class="score-ring" style="color:${pass?'var(--good)':'var(--warn)'}">${score}</div>`+
    `<div class="passtag ${pass?'pass':'fail'}">${pass?'✓ 合格':'✗ 不合格'} · 满分 100 · 合格线 ${set.pass}</div>`+
    `<div class="stats"><div class="stat"><b>${pad(total)}</b><span>总题数</span></div><div class="stat ok"><b>${pad(correct)}</b><span>答对</span></div><div class="stat again"><b>${pad(total-correct)}</b><span>答错</span></div></div>`+
    `<div id="examLB"></div>`+
    wl+
    `<div style="margin-top:24px"><button class="copy" onclick="startExam('${set.id}')">🔁 再考一次</button><button class="copy" style="margin-left:8px;background:var(--bg);color:var(--text);border:1.5px solid var(--border)" onclick="home()">← 返回目录</button></div>`;
  document.getElementById('doneReview').style.display='none';
  de.style.display='block';document.getElementById('done').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
  handleExamScore();
}

/* ---------- 排行榜（Supabase 全网榜 / 本地榜兜底）---------- */
function sbH(extra){return Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},extra||{});}
function lbLocal(e){const k=e.set_id;store.lb[k]=store.lb[k]||[];store.lb[k].push({name:e.name,score:e.score,correct:e.correct,total:e.total,created_at:new Date().toISOString()});store.lb[k].sort((a,b)=>b.score-a.score||(new Date(a.created_at)-new Date(b.created_at)));store.lb[k]=store.lb[k].slice(0,100);saveStore();}
async function lbSubmit(e){
  if(SB_URL){try{await fetch(SB_URL+'/rest/v1/leaderboard',{method:'POST',headers:sbH({'Prefer':'return=minimal'}),body:JSON.stringify({name:e.name,set_id:e.set_id,score:e.score,correct:e.correct,total:e.total})});return;}catch(err){}}
  lbLocal(e);
}
async function lbFetch(setId){
  if(SB_URL){try{const r=await fetch(SB_URL+'/rest/v1/leaderboard?set_id=eq.'+encodeURIComponent(setId)+'&order=score.desc,created_at.asc&limit=50',{headers:sbH()});if(r.ok)return await r.json();}catch(err){}}
  return (store.lb[setId]||[]).slice(0,50);
}
function lbListHtml(list,meScore){
  if(!list||!list.length)return '<div class="lb-empty">还没有成绩，快来抢占第一名 🥇</div>';
  let meDone=false;
  return '<div class="lb-list">'+list.slice(0,50).map((e,idx)=>{
    const isMe=!meDone&&e.name===store.name&&(meScore==null||e.score===meScore);if(isMe)meDone=true;
    const medal=['🥇','🥈','🥉'][idx]||('#'+(idx+1));
    return `<div class="lb-row${idx<3?' top':''}${isMe?' me':''}"><span class="lb-rank">${medal}</span><span class="lb-name">${esc(e.name||'匿名')}</span><span class="lb-meta">${e.correct}/${e.total}</span><span class="lb-score">${e.score}</span></div>`;
  }).join('')+'</div>';
}
function handleExamScore(){
  const box=document.getElementById('examLB');if(!box)return;
  if(!store.name){
    box.innerHTML=`<div class="nick"><input id="nickIn" maxlength="16" placeholder="起个昵称冲榜（如：困困）"><button class="copy" style="margin-top:0" onclick="submitExamScore()">提交成绩</button></div><p class="lb-note">${SB_URL?'昵称+分数将上传到全网排行榜':'当前为本地榜（未联网）'}</p>`;
    const inp=document.getElementById('nickIn');if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter')submitExamScore();});
  }else{doSubmitAndRender(box);}
}
function submitExamScore(){
  const v=((document.getElementById('nickIn')||{}).value||'').trim()||'匿名';
  store.name=v.slice(0,16);saveStore();
  doSubmitAndRender(document.getElementById('examLB'));
}
async function doSubmitAndRender(box){
  if(!box||!lastExam)return;
  box.innerHTML='<p class="lb-note">提交中…</p>';
  await lbSubmit({name:store.name,set_id:lastExam.setId,score:lastExam.score,correct:lastExam.correct,total:lastExam.total});
  const list=await lbFetch(lastExam.setId);
  const rank=list.filter(x=>x.score>lastExam.score).length+1;
  box.innerHTML=`<div style="text-align:center;margin:8px 0 4px"><span class="rank-banner">🏆 ${esc(lastExam.setName)} · 第 ${rank} / ${list.length} 名</span></div>`+
    lbListHtml(list,lastExam.score)+
    `<button class="lb-btn" style="margin-top:12px" onclick="showLeaderboard('${lastExam.setId}')">查看完整排行榜</button>`+
    `<p class="lb-note">${SB_URL?'全网共享榜 · 实时':'本地榜 · 未联网（联网后可与所有人 PK）'}</p>`;
}
function showLeaderboard(setId){
  document.getElementById('setup').style.display='none';
  document.getElementById('done').style.display='none';
  document.getElementById('bar').style.display='none';
  stage.style.display='none';
  document.getElementById('lb').style.display='block';
  renderLBScreen(setId||EXAMSETS[0].id);
  window.scrollTo({top:0,behavior:'smooth'});
}
async function renderLBScreen(setId){
  const lb=document.getElementById('lb');
  const tabs=EXAMSETS.map(s=>`<button class="${s.id===setId?'on':''}" onclick="renderLBScreen('${s.id}')">${s.emoji} ${s.name}</button>`).join('');
  lb.innerHTML=`<div class="lb-wrap"><button class="back" onclick="home()">‹ 返回目录</button><h2 style="margin:16px 0 2px;font-size:26px;font-weight:700">🏆 排行榜</h2><div class="lb-tabs">${tabs}</div><div id="lbList"><p class="lb-note">加载中…</p></div><p class="lb-note">${SB_URL?'全网共享榜 · 实时刷新':'本地榜 · 未联网（仅本设备）'}</p></div>`;
  const list=await lbFetch(setId);
  const el=document.getElementById('lbList');if(el)el.innerHTML=lbListHtml(list,null);
}
function restart(){
  if(!pool.length)return home();
  shuffle(pool);i=0;for(const k in grades)delete grades[k];sess={answered:0,correct:0};busy=false;mode='review';
  document.getElementById('done').style.display='none';
  stage.style.display='';document.getElementById('bar').style.display='flex';
  render();window.scrollTo({top:0,behavior:'smooth'});
}
function cp(){const t=document.getElementById('result').textContent;if(navigator.clipboard)navigator.clipboard.writeText(t);const b=event.target;b.textContent='✓ 已复制';setTimeout(()=>b.textContent='📋 复制结果串',1500);}
document.addEventListener('keydown',e=>{
  if(!pool.length||i>=pool.length||busy)return;
  const c=pool[i], k=e.key.toLowerCase();
  if(c.type==='choice'){
    if(document.querySelector('.opt[disabled]'))return;
    let idx=-1;
    if(k>='1'&&k<='9')idx=+k-1; else if(k>='a'&&k<='f')idx=k.charCodeAt(0)-97;
    if(idx>=0&&idx<c.options.length){e.preventDefault();choose(idx);}
    return;
  }
  const flip=document.getElementById('flip');
  if((e.key===' '||e.key==='Enter')&&flip&&!flip.classList.contains('flipped')){e.preventDefault();reveal();return;}
  if(flip&&flip.classList.contains('flipped')&&['1','2','3','4'].includes(k)){
    const b=document.querySelectorAll('.rate.show .rb')[+k-1];if(b){e.preventDefault();b.click();}
  }
});
/* 入口：分享页先进控制台/目录；每日 session 直接开始 */
if(STANDALONE){home();}else{pool=CARDS;render();}
</script></body></html>
